agentInstructions:
  noConfiguration: (aún ninguna)
  text: |
    Uso la extensión de navegador Readomi para traducir páginas web. Configura su servicio de traducción, por favor.
    Lee primero la guía: $1
    Síguela: pregúntame qué servicio quiero y dónde está mi clave de API. Verifica con mi clave usando la plantilla de solicitud de la guía hasta que una solicitud funcione. Escribe el JSON de configuración del servicio en mi portapapeles. Después dime que lo pegue en "Servicio de traducción" de la página de ajustes de Readomi y lo aplique.
    Mi configuración actual, con la clave oculta:
    $2
