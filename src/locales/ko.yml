agentInstructions:
  noConfiguration: (아직 없음)
  text: |
    브라우저 확장 프로그램 Readomi로 웹 페이지를 번역하고 있습니다. 번역 서비스를 설정해 주세요.
    먼저 가이드를 읽어 주세요: $1
    가이드를 따라 주세요: 제가 원하는 서비스와 API 키의 위치를 물어봐 주세요. 가이드의 요청 템플릿으로 제 키를 사용해 요청이 성공할 때까지 확인해 주세요. 번역 서비스 구성 JSON을 제 클립보드에 써 주세요. 마지막으로 Readomi 설정 페이지의 "번역 서비스"에 붙여 넣고 적용하라고 알려 주세요.
    현재 구성(키는 가려짐):
    $2
