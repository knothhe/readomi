agentInstructions:
  noConfiguration: (пока нет)
  text: |
    Я перевожу веб-страницы с помощью расширения браузера Readomi. Пожалуйста, настрой для меня его сервис перевода.
    Сначала прочитай руководство: $1
    Следуй ему: спроси, какой сервис я хочу использовать и где мой API-ключ. Проверь с моим ключом по шаблону запроса из руководства, пока запрос не пройдёт. Запиши JSON с конфигурацией сервиса в мой буфер обмена. Затем скажи мне вставить его в разделе «Сервис перевода» на странице настроек Readomi и применить.
    Моя текущая конфигурация, ключ скрыт:
    $2
