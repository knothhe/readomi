agentInstructions:
  noConfiguration: (chưa có)
  text: |
    Tôi dùng tiện ích trình duyệt Readomi để dịch trang web. Hãy thiết lập dịch vụ dịch cho tôi.
    Đọc hướng dẫn trước: $1
    Làm theo hướng dẫn: hỏi tôi muốn dùng dịch vụ nào và khóa API của tôi ở đâu. Dùng khóa của tôi và mẫu yêu cầu trong hướng dẫn để kiểm tra cho đến khi yêu cầu thành công. Ghi JSON cấu hình dịch vụ vào bộ nhớ tạm của tôi. Cuối cùng bảo tôi dán nó vào mục "Dịch vụ dịch" trên trang cài đặt Readomi và áp dụng.
    Cấu hình hiện tại của tôi, khóa đã được che:
    $2
