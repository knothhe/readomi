agentInstructions:
  noConfiguration: （まだありません）
  text: |
    ブラウザー拡張機能 Readomiでウェブページを翻訳しています。翻訳サービスを設定してください。
    まずガイドを読んでください：$1
    ガイドに従ってください：使いたいサービスと API キーの場所を私に聞いてください。ガイドのリクエストテンプレートを使い、私のキーでリクエストが成功するまで確認してください。翻訳サービスの設定 JSON を私のクリップボードに書き込んでください。最後に、Readomi の設定ページの「翻訳サービス」に貼り付けて適用するよう伝えてください。
    現在の設定（キーはマスク済み）：
    $2
