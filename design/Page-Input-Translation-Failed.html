<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>输入框翻译 · Failed</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fffbf6;color:#302b29;font:13px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
main{padding:52px 70px}
h1{font-size:24px;margin:0 0 24px}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer}
textarea{display:block;width:100%;height:180px;padding:16px;border:1px solid #d9cdc4;border-radius:10px;background:white;resize:none}
.primary{float:right;margin-top:6px;border:0;border-radius:7px;padding:7px 14px;background:#b6533e;color:white}
.dock{position:fixed;right:20px;bottom:20px;width:356px;max-width:calc(100vw - 40px)}
.toast{display:flex;align-items:flex-start;gap:10px;width:100%;padding:14px 15px;border:1px solid #e8e0db;border-radius:12px;background:white;box-shadow:0 4px 20px rgb(52 32 23 / 5%)}
.toast img{flex:none;width:22px;height:22px;margin-top:1px}
.copy{min-width:0;flex:1}
.message{font-weight:500;color:#b42318}
.description{margin-top:2px;color:#716862;font-size:12px;line-height:16px}
details{margin-top:4px;max-width:100%;color:#716862;font-size:12px;line-height:16px}
summary{cursor:pointer}
pre{max-height:160px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin:4px 0 0;font:12px/16px ui-monospace,SFMono-Regular,Menlo,monospace}
.close{display:grid;place-items:center;flex:none;width:24px;height:24px;margin-left:auto;padding:0;border:0;border-radius:5px;background:transparent;color:#716862;font-size:18px;line-height:1}
.close:hover{background:#f4eee9;color:#302b29}
button:focus-visible,summary:focus-visible{outline:2px solid #b6533e;outline-offset:3px}
@media(max-width:600px){.dock{right:12px;bottom:12px;max-width:calc(100vw - 24px)}}
</style>
<body>
<main>
  <h1>消息</h1>
  <textarea aria-label="消息">请帮我确认明天下午的会议时间。</textarea>
  <button class="primary" type="button">发送</button>
</main>
<div class="dock">
  <div class="toast" role="alert">
    <img src="../assets/design/icon.svg" alt="" width="22" height="22">
    <div class="copy">
      <div class="message">输入框翻译失败，原文已保留。</div>
      <div class="description">请检查翻译服务或重试，可展开错误详情查看原因。</div>
      <details>
        <summary>错误详情</summary>
        <pre>ProviderRequestError: The model rejected-model does not exist</pre>
      </details>
    </div>
    <button class="close" type="button" aria-label="关闭">×</button>
  </div>
</div>
</body>
</html>
