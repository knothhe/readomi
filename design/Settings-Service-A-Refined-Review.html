<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>翻译服务 · 当前布局预览</title><style>*{box-sizing:border-box}body{margin:0;background:#eeeae3;color:#302e2b;font:13px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:25px 30px 21px;border-bottom:1px solid #dcd5ca}h1{font-size:22px;font-weight:600;letter-spacing:-.6px;margin:0 0 3px}p{font-size:12px;color:#827b72;margin:0}button,a{font:inherit;color:inherit;text-decoration:none}button{cursor:pointer;border:0;background:none;border-radius:5px;padding:6px 11px;font-size:12px;white-space:nowrap}.controls{display:flex;gap:3px;padding:3px;border-radius:7px;background:#e1dbd1}button[aria-pressed=true]{background:#fffefa;color:#b6533e;box-shadow:0 1px 4px #302e2b10}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;padding:23px 30px}.grid>article{min-width:0}.caption{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.caption h2{font-size:13px;font-weight:550;margin:0}.caption a{font-size:11px;color:#827b72}.viewport{position:relative;overflow:hidden;background:#faf8f4;border:1px solid #dcd5ca;border-radius:9px;box-shadow:0 6px 24px #302e2b06}iframe{width:1120px;height:740px;border:0;display:block;transform-origin:0 0}.description{margin-top:12px;font-size:12px;line-height:1.8}.foot{font-size:11px;margin:0 30px 24px;color:#827b72}button:focus-visible,a:focus-visible{outline:2px solid #b6533e;outline-offset:3px}@media(max-width:980px){header{align-items:flex-start;flex-direction:column}.controls{flex-wrap:wrap}.grid{grid-template-columns:1fr}.viewport{max-width:800px}}@media(max-width:600px){header{padding:22px 18px}.grid{padding:20px 18px}.foot{margin:0 18px 24px}}</style></head><body><header><div><h1>翻译服务 · 当前布局</h1><p>列表只标记当前服务，测试结果按需出现。</p></div><div class="controls" role="group" aria-label="预览状态"><button aria-pressed="true" data-view="normal">日常状态</button><button aria-pressed="false" data-view="passed">测试通过</button><button aria-pressed="false" data-view="failed">测试失败</button><button aria-pressed="false" data-view="agent">agent 配置</button></div></header><div class="grid"><article><div class="caption"><h2>服务列表</h2><a href="Settings-Service-A-Refined.html" target="_blank" data-open="list">单独查看 ↗</a></div><div class="viewport"><iframe id="list" title="服务列表" src="Settings-Service-A-Refined.html"></iframe></div><p class="description">图标、服务名、模型对齐在一行；只保留“当前”，编辑和其他操作收在行尾。</p></article><article><div class="caption"><h2>编辑服务</h2><a href="Settings-Service-A-Refined-Edit.html" target="_blank" data-open="edit">单独查看 ↗</a></div><div class="viewport"><iframe id="edit" title="编辑服务" src="Settings-Service-A-Refined-Edit.html"></iframe></div><p class="description">图标归入标题，“无需 API Key”与字段标签同排；获取模型按钮保留简短文字。</p></article></div><p class="foot">测试通过后短暂提示并消失；失败时显示原因与重试。以上为本地设计预览，不向翻译服务发起真实请求。</p><script>function resize(){document.querySelectorAll('.viewport').forEach(box=>{const scale=box.clientWidth/1120;box.querySelector('iframe').style.transform='scale('+scale+')';box.style.height=(740*scale)+'px';});}new ResizeObserver(resize).observe(document.body);resize();const views={normal:['Settings-Service-A-Refined.html','Settings-Service-A-Refined-Edit.html'],passed:['Settings-Service-A-Refined-Test-Passed.html','Settings-Service-A-Refined-Edit.html'],failed:['Settings-Service-A-Refined-Test-Failed.html','Settings-Service-A-Refined-Edit.html'],agent:['Settings-Service-A-Refined.html','Settings-Service-A-Refined-Agent.html']};document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-view]').forEach(el=>el.setAttribute('aria-pressed',String(el===button)));['list','edit'].forEach((id,index)=>{document.getElementById(id).src=views[button.dataset.view][index];document.querySelector('[data-open='+id+']').href=views[button.dataset.view][index];});}));</script></body></html>
