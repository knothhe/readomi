<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>设置 · 悬停与视频字幕</title><style>body{margin:0;background:#f7f8fa;color:#151a2d;font:13px system-ui}main{width:640px;padding:36px 40px}h2{font-size:15px}section{margin:24px 0}.card{background:white;border:1px solid #e3e6ec;border-radius:12px;padding:18px}label{display:block;margin:12px 0}input,select,textarea{box-sizing:border-box;width:100%;padding:8px;border:1px solid #d5d9e1;border-radius:8px;background:#fff;font:13px system-ui}button{padding:8px 14px;margin:6px 6px 0 0;border:1px solid #d5d9e1;border-radius:8px;background:#fff;color:#151a2d}p{color:#626978;line-height:1.6}.error{color:#c33}.caption{background:#151a2d;color:white;padding:20px;text-align:center;border-radius:12px}.translation{color:#f24a2c}</style><main><h2>局部与视频翻译</h2><div class="card"><label>悬停翻译 <input type="checkbox" checked style="width:auto"></label><p>鼠标停在段落上，按住 Alt 500 毫秒翻译；再次触发可恢复原文。</p><label>视频字幕翻译 <input type="checkbox" checked style="width:auto"></label><p>复用当前翻译服务。支持 YouTube 已开启的字幕和 HTML5 字幕轨道；无字幕视频暂不支持。</p><label>字幕显示方式<select><option>双语对照</option><option>仅译文</option></select></label></div></main></html>
