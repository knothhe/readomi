<style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"SF Pro Text","PingFang SC",system-ui,sans-serif;background:var(--bg);color:var(--fg);font-size:13px}body{--bg:#faf8f5;--fg:#302b29;--card:#fff;--muted:#f5f0eb;--border:#e8e0db;--sub:#716862;--primary:#b6533e;--on-primary:#fff8ec;--success:#3f8f5a;--attention:#c7863c;--input:#d9cdc4;--secondary:#f1ebe6}body.dark{--bg:#1c1917;--fg:#eae3dc;--card:#26211e;--muted:#2e2723;--border:#40352e;--sub:#a69b93;--primary:#e9ab91;--on-primary:#1c1917;--success:#5db57a;--secondary:#342c27;--input:#4a3c32;--attention:#d9a05c}button{font:inherit;cursor:pointer;color:inherit}main{display:flex;flex-direction:column;gap:10px;padding:14px;width:320px}.languages{display:flex;align-items:center;gap:8px}.language{height:44px;flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px;text-align:left;padding:0 12px;border:1px solid var(--border);border-radius:10px;background:var(--card)}.language strong{font-size:14px;line-height:18px}.language small{font-size:11px;line-height:14px;color:var(--sub)}.arrow{width:16px;flex-shrink:0;color:var(--sub)}.mode{display:flex;gap:2px;padding:2px;border-radius:8px;background:var(--muted)}.mode button{flex:1;height:28px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--sub);font-size:12px;font-weight:500}.mode .selected{background:var(--card);border-color:var(--border);color:var(--fg);box-shadow:0 1px 2px #0000000d}.action{height:40px;display:flex;align-items:center;justify-content:space-between;border:0;border-radius:10px;background:var(--primary);color:var(--on-primary);padding:0 14px;font-size:14px;font-weight:600}.action small{font-size:11px;font-weight:400;letter-spacing:.04em;opacity:.6}.action.original{background:var(--card);border:1px solid var(--fg);color:var(--fg)}.action:disabled{opacity:.5;cursor:not-allowed}.action-block{display:flex;flex-direction:column;gap:8px}.notice{font-size:12px;color:var(--sub);margin:0;padding:0 2px;line-height:16px}.progress{padding:0 2px;display:flex;flex-direction:column;gap:6px}.progress-label{display:flex;justify-content:space-between;color:var(--sub);font-size:12px;line-height:16px}.track{height:2px;background:var(--border);border-radius:2px;overflow:hidden}.track span{display:block;width:32%;height:100%;background:var(--primary)}.hover-row{height:32px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px}.hover-label{font-size:13px}.hover-controls{display:flex;align-items:center;gap:10px}.trigger{background:var(--muted);color:var(--sub);border:0;border-radius:4px;padding:2px 6px;font-size:11px;line-height:16px}.switch{width:32px;height:18px;border:1px solid transparent;border-radius:20px;padding:0;background:var(--input);box-shadow:0 1px 2px #0000000d}.switch span{display:block;width:16px;height:16px;border-radius:50%;background:var(--bg)}.switch.on{background:var(--primary)}.switch.on span{transform:translateX(14px)}footer{display:flex;align-items:center;justify-content:space-between;gap:8px;width:320px;border-top:1px solid var(--border);padding:6px 10px 6px 14px}.service{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:12px;min-width:0}.dot{width:6px;height:6px;background:var(--success);border-radius:50%;flex-shrink:0}.dot.attention{background:var(--attention)}.service-name{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.footer-actions{display:flex;gap:2px}.icon-button{width:28px;height:28px;border:0;border-radius:6px;background:transparent;color:var(--sub);display:flex;align-items:center;justify-content:center}.emphasis{font:14px Georgia,serif}.emphasis.on{background:var(--secondary);color:var(--primary)}.setup{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--card)}.setup strong{display:block;font-size:14px;line-height:20px}.setup p{margin:4px 0 0;font-size:12px;line-height:17px;color:var(--sub)}.setup .action{justify-content:center}.translation-controls{display:flex;flex-direction:column}.control-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;padding:4px 2px}.control-copy{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px}.control-label{font-size:13px;line-height:18px}.control-hint{border:0;background:transparent;padding:0;color:var(--sub);font-size:11px;line-height:16px;text-align:left}.page-action{flex-shrink:0;min-width:64px;height:28px;padding:0 10px;border:0;border-radius:14px;background:var(--muted);color:var(--fg);font-size:12px;font-weight:500}.page-action:disabled{opacity:.5;cursor:not-allowed}.control-feedback{padding:0 0 10px;display:flex;flex-direction:column;gap:8px}</style></head>
