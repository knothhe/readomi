nd);outline-offset:3px}

/* A local design prototype. Changes are simulated in memory. */
const names={deepseek:'DeepSeek',gemini:'Gemini',anthropic:'Anthropic'};
let currentId='deepseek';let available=['deepseek','gemini','anthropic'];
const toast=text=>{const el=document.querySelector('[data-toast]');if(el)el.textContent=text};
function render(){document.querySelectorAll('.service-row').forEach(row=>{const active=row.dataset.id===currentId;row.dataset.current=String(active);const badge=row.querySelector('[data-role]');badge.hidden=!active;badge.textContent='当前';row.querySelector('[data-use-service]').disabled=active;row.querySelector('[data-remove]').disabled=active});const count=document.querySelector('[data-service-count]');if(count)count.textContent=available.length}
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.dataset.useService){currentId=button.dataset.useService;document.querySelectorAll('.menu').forEach(menu=>menu.open=false);render();toast('已切换为 '+names[currentId]+'。后续翻译使用新服务，已有译文保留。')}if(button.dataset.remove){const id=button.dataset.remove;if(id===currentId)return;available=available.filter(item=>item!==id);document.querySelector('[data-id="'+id+'"]').remove();render();toast(names[id]+' 已移除。')}if(button.dataset.test){const row=button.closest('.service-row');const status=row.querySelector('.status');status.textContent='测试中…';button.disabled=true;setTimeout(()=>{status.textContent='已连接';button.disabled=false;toast(names[button.dataset.test]+' · 检查成功。')},900)}if(button.hasAttribute('data-copy')){navigator.clipboard.writeText('请帮我配置 Readomi 翻译服务。先验证服务地址、模型和请求格式，再返回含 type、name、apiKey、model 和 baseURL 的配置 JSON。对于无需 API Key 的服务，设置 noApiKey: true 并省略 apiKey。').then(()=>toast('已复制')).catch(()=>toast('无法复制，请重试。'))}});
document.addEventListener('click',event=>{document.querySelectorAll('.menu[open]').forEach(menu=>{if(!menu.contains(event.target))menu.open=false})});
if(document.querySelector('[data-service-count]'))render();
const editedService=new URLSearchParams(location.search).get('service');
if(editedService&&names[editedService]&&document.querySelector('.back')&&document.querySelector('h1').textContent.startsWith('修改')){const fixtures={deepseek:{type:'deepseek',name:'DeepSeek',apiKey:'sk-…a9f2',model:'deepseek-chat'},gemini:{type:'gemini',name:'Gemini',apiKey:'…b7c3',model:'gemini-3.5-flash-lite'},anthropic:{type:'anthropic',name:'Anthropic',apiKey:'sk-ant-…c4d8',model:'claude-haiku-4-5'}};const hosts={deepseek:'api.deepseek.com',gemini:'generativelanguage.googleapis.com',anthropic:'api.anthropic.com'};const item=fixtures[editedService];document.querySelector('h1').textContent='修改 '+item.name;document.querySelector('.textarea').value=JSON.stringify(item,null,2);document.querySelector('.preview .mark').textContent=item.name[0];document.querySelector('.preview h2').replaceChildren(document.createTextNode(item.name+' '));const model=document.createElement('span');model.className='model';model.textContent=item.model;document.querySelector('.preview h2').append(model);document.querySelector('.preview .host').textContent='网页文本发往 '+hosts[editedService];document.querySelector('.editor-note').textContent='保存修改后保留当前服务选择；现有译文保留。'}
