<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Readomi · 视频窗口与字幕字号</title>
<style>
:root{--bg:#faf8f5;--surface:#fffdfa;--paper:#f2ece2;--ink:#302b29;--muted:#776d64;--line:#e5ddd3;--accent:#b6533e;--tint:#f5e7df;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft Yahei',sans-serif;color:var(--ink);background:var(--bg);font-synthesis:none}
*{box-sizing:border-box}body{margin:0;width:1120px;min-height:1240px}main{padding:32px 40px}h1,h2,p{margin:0}h1{font-size:26px;font-weight:600;letter-spacing:-.8px;line-height:1.4}p{margin-top:10px;font-size:12px;color:var(--muted);line-height:1.7}.samples{display:flex;gap:40px;margin-top:30px;align-items:flex-end}.sample{flex-shrink:0}.sample-label{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:12px;font-size:12px}h2{font-size:13px;font-weight:550}.sample-label span{color:var(--muted);font-variant-numeric:tabular-nums}.sample.large{margin-top:26px}.video{position:relative;width:var(--width);height:var(--height);overflow:hidden;background:radial-gradient(ellipse 85% 75% at 10% 120%,#7c9588 0 99%,transparent 100%),radial-gradient(ellipse 100% 80% at 90% 115%,#a6b9b1 0 99%,transparent 100%),linear-gradient(150deg,#f1e6d9,#dce8e5);border-radius:10px}.sun{position:absolute;left:71%;top:15%;width:8%;aspect-ratio:1;border-radius:50%;background:#fff6;box-shadow:0 0 70px #fff4}.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:9%;aspect-ratio:1;border:1px solid #fff7;background:#fff2;border-radius:50%;display:grid;place-items:center}.play:after{content:'';width:28%;height:34%;margin-left:5%;background:#fff9;clip-path:polygon(0 0,100% 50%,0 100%)}.caption{position:absolute;left:50%;top:98%;transform:translate(-50%,-100%);width:max-content;max-width:80%;font-weight:600;line-height:1.4;color:#fff;text-align:center;white-space:pre-line;text-shadow:0 2px 4px #000,0 0 2px #000;font-size:var(--subtitle-size)}.caption-original{font-size:.85em;margin-bottom:4px}.note{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);line-height:1.8}
</style></head><body><main><h1>随视频窗口调整字号</h1><p>字幕字号设为 24 px，以 640 像素宽的视频为基准。</p>
<div class="samples"><section class="sample"><div class="sample-label"><h2>320 × 180</h2><span>实际字号 12 px</span></div><div class="video" style="--width:320px;--height:180px;--subtitle-size:12px"><div class="sun"></div><div class="play" aria-hidden="true"></div><div class="caption"><div class="caption-original">A new idea.</div><div>新的想法。</div></div></div></section><section class="sample"><div class="sample-label"><h2>640 × 360</h2><span>实际字号 24 px</span></div><div class="video" style="--width:640px;--height:360px;--subtitle-size:24px"><div class="sun"></div><div class="play" aria-hidden="true"></div><div class="caption"><div class="caption-original">A new idea.</div><div>新的想法。</div></div></div></section></div>
<section class="sample large"><div class="sample-label" style="width:960px"><h2>960 × 540</h2><span>实际字号 36 px</span></div><div class="video" style="--width:960px;--height:540px;--subtitle-size:36px"><div class="sun"></div><div class="play" aria-hidden="true"></div><div class="caption"><div class="caption-original">A new idea.</div><div>新的想法。</div></div></div></section>
<div class="note">字号方式：随视频窗口 · 字幕显示方式：双语对照 · 字幕预设：清晰 · 字幕位置：底部</div></main></body></html>
