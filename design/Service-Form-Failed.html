<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>翻译服务 · 手动配置失败</title><style>body{margin:0;background:#faf8f5;color:#302b29;font:13px system-ui}main{width:640px;padding:36px 40px}h2{font-size:15px}section{margin:24px 0}.card{background:white;border:1px solid #e8e0db;border-radius:12px;padding:18px}label{display:block;margin:12px 0}input,select,textarea{box-sizing:border-box;width:100%;padding:8px;border:1px solid #d9cdc4;border-radius:8px;background:#fff;font:13px system-ui}button{padding:8px 14px;margin:6px 6px 0 0;border:1px solid #d9cdc4;border-radius:8px;background:#fff;color:#302b29}p{color:#716862;line-height:1.6}.error{color:#c33}.caption{background:#302b29;color:white;padding:20px;text-align:center;border-radius:12px}.translation{color:#b6533e}</style><main><h2>翻译服务</h2><div class="card"><button>手动配置</button><button>agent 配置</button><label>服务类型<select><option>openai</option></select></label><label>名称<input value="OpenAI"></label><label>API 地址<input></label><label>API Key<input type="password" value="sk-example"></label><p>本地无鉴权服务可填写 local；修改时留空沿用原密钥。</p><label>模型<input value="example-model"></label><label>请求格式<select><option>openai-responses</option></select></label><div style="display:flex;flex-direction:column;gap:8px"><label for="request-body">请求参数（思考程度等）</label><textarea id="request-body" rows="5" spellcheck="false" placeholder='{ "reasoning": { "effort": "none" } }' style="box-sizing:border-box;width:100%;resize:vertical;padding:10px 12px;border:1px solid #d9cdc4;border-radius:8px;background:white;color:#302b29;font:12px/18px ui-monospace,monospace"></textarea><p style="margin:0;font-size:12px">填写 body 内的 JSON 对象，无需再包一层 body；留空使用服务默认值。参数会合并进每次请求，并覆盖同名字段。</p><p style="margin:0;font-size:12px">思考参数示例（请按模型文档调整）： <code>{ "reasoning": { "effort": "none" } }</code></p></div><p class="error">失败，没有保存</p><code>HTTP 401</code><button style="width:100%;background:#b6533e;color:white">测试并保存</button></div></main></html>
