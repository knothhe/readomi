function dismiss(){clearTimeout(noticeTimer);notice.hidden=true;}
function showNotice(title,detail='',error=false,persistent=false){clearTimeout(noticeTimer);notice.classList.toggle('error',error);notice.classList.remove('testing');notice.querySelector('.notice-title').textContent=title;notice.querySelector('.notice-detail').textContent=detail;notice.querySelector('.notice-detail').hidden=!detail;notice.querySelector('[data-retry]').hidden=!error;notice.querySelector('.notice-icon').innerHTML=error?"<path d=\"m12 3 10 18H2ZM12 9v5M12 17h.01\"/>":"<path d=\"m5 12 4 4L19 6\"/>";notice.hidden=false;if(!error&&!persistent)noticeTimer=setTimeout(dismiss,4000);}
function testService(id){if(testing)return;activeTest=id;testing=true;document.querySelectorAll('.menu').forEach(el=>el.open=false);showNotice(fixtures[id].name+' · 测试中…','',false,true);notice.classList.add('testing');setTimeout(()=>{testing=false;notice.classList.remove('testing');showNotice(fixtures[id].name+' · 测试通过');},750);}
function loadEditor(id,isAdd=false){const item=fixtures[id];if(!document.getElementById('type'))return;document.getElementById('type').value=id;document.getElementById('name').value=item.name;document.getElementById('model').value=isAdd?'':item.model;document.getElementById('url').value=item.url;document.getElementById('key').value='';document.getElementById('key').placeholder=isAdd?'输入 API Key':'留空沿用已保存的密钥';document.querySelector('[data-title]').textContent=isAdd?'添加服务':'修改 '+item.name;document.querySelector('[data-mark]').innerHTML=marks[id]||marks.deepseek;document.getElementById('document').value=JSON.stringify({type:id,name:item.name,model:item.model,apiKey:'YOUR_API_KEY'},null,2);}
function setMode(mode){document.querySelectorAll('[data-mode]').forEach(el=>el.setAttribute('aria-selected',String(el.dataset.mode===mode)));document.getElementById('manual-panel').hidden=mode!=='manual';document.getElementById('agent-panel').hidden=mode!=='agent';document.querySelectorAll('#manual-panel input,#manual-panel select').forEach(el=>el.disabled=mode!=='manual');if(mode==='manual')document.getElementById('key').disabled=document.querySelector('[data-no-key]').checked;document.querySelector('[data-form-error]').textContent='';}
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;
if(button.dataset.mode)setMode(button.dataset.mode);
if(button.dataset.pick){current=button.dataset.pick;document.querySelectorAll('[data-pick]').forEach(el=>{const active=el.dataset.pick===current;el.setAttribute('aria-checked',String(active));el.closest('.service-row').classList.toggle('current',active);el.querySelector('.badge').hidden=!active;el.closest('.service-row').querySelector('[data-remove]').disabled=active;});}
if(button.dataset.test)testService(button.dataset.test);
if(button.dataset.remove&&button.dataset.remove!==current){button.closest('.service-row').remove();showNotice(fixtures[button.dataset.remove].name+' · 已移除');}
if(button.hasAttribute('data-close'))dismiss();
if(button.hasAttribute('data-retry'))testService(activeTest);
if(button.hasAttribute('data-eye')){const key=document.getElementById('key');key.type=key.type==='password'?'text':'password';button.setAttribute('aria-label',key.type==='password'?'显示 API Key':'隐藏 API Key');}
if(button.hasAttribute('data-fetch')){const id=document.getElementById('type').value;const results=document.querySelector('[data-model-results]');results.replaceChildren();[fixtures[id].model,id==='deepseek'?'deepseek-reasoner':fixtures[id].model].filter((value,index,array)=>array.indexOf(value)===index).forEach(model=>{const option=document.createElement('button');option.type='button';option.textContent=model;option.addEventListener('click',()=>{document.getElementById('model').value=model;results.hidden=true;});results.append(option);});results.hidden=false;}
if(button.hasAttribute('data-copy'))navigator.clipboard.writeText('请帮我配置 Readomi 翻译服务。验证服务地址、模型和 API Key 后，返回含 type、name、baseURL、apiKey 和 model 的配置 JSON。无鉴权服务设置 noApiKey: true。').then(()=>showNotice('说明已复制')).catch(()=>showNotice('无法复制说明','请重试。',true));
});
document.addEventListener('change',event=>{if(event.target.matches('[data-no-key]')){const key=document.getElementById('key');key.disabled=event.target.checked;key.placeholder=event.target.checked?'无需密钥':'留空沿用已保存的密钥';}if(event.target.id==='type'){const id=event.target.value;loadEditor(id,document.body.dataset.add==='true');document.getElementById('key').placeholder='输入 API Key';document.querySelector('[data-model-results]').hidden=true;}});
document.querySelector('form')?.addEventListener('submit',event=>{event.preventDefault();const error=document.querySelector('[data-form-error]');error.textContent='';if(!document.getElementById('agent-panel').hidden){try{const value=JSON.parse(document.getElementById('document').value);if(!value.type||!value.model)throw new Error();}catch{error.textContent='请输入包含服务类型和模型的有效配置。';return;}}const button=document.querySelector('[data-save]');button.disabled=true;button.textContent='测试中…';setTimeout(()=>{button.disabled=false;button.textContent='测试并保存';showNotice('测试通过 · 已保存');},750);});
document.addEventListener('click',event=>{document.querySelectorAll('.menu[open]').forEach(menu=>{if(!menu.contains(event.target))menu.open=false;});});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){dismiss();document.querySelectorAll('.menu').forEach(el=>el.open=false);}const pick=event.target.closest('[data-pick]');if(pick&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.key)){event.preventDefault();const picks=[...document.querySelectorAll('[data-pick]')];const index=picks.indexOf(pick);const next=picks[(index+(['ArrowUp','ArrowLeft'].includes(event.key)?-1:1)+picks.length)%picks.length];next.focus();next.click();}});
const id=new URLSearchParams(location.search).get('service')||'deepseek';if(fixtures[id])loadEditor(id,document.body.dataset.add==='true');if(document.getElementById('agent-panel'))setMode(document.body.dataset.mode||'manual');
</script></body></html>
