        q('.rd-heading h1').textContent=defs.find(d=>d[0]===state.page)[1];
        qa('[data-nav]').forEach(b=>{if(b.dataset.nav===state.page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
        for(const key of ['mode','style','theme','color'])qa('[data-'+key+']').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset[key]===state[key])));
        q('[data-hover]').checked=state.hover;q('[data-bold]').checked=state.bold;q('[data-stream-row]').hidden=!state.hover;q('[data-input-translation]').checked=state.inputTranslation;
        q('[data-style-row]').hidden=state.mode==='only';
        const original=q('[data-original]');original.hidden=state.mode==='only';const sentence='Reading and experience train your model of the world.';original.replaceChildren();
        sentence.split(' ').forEach((word,index)=>{if(index)original.append(' ');const span=document.createElement('span');if(state.bold){const b=document.createElement('strong');const n=Math.ceil(word.length/2);b.textContent=word.slice(0,n);span.append(b,word.slice(n));}else span.textContent=word;original.append(span);});
        const translation=q('[data-translation]');translation.style.cssText='';qa('[data-reading-font]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.readingFont===state.readingFont)));translation.style.fontFamily=state.readingFont==='serif'?'"Songti SC", "STSong", "Noto Serif CJK SC", "SimSun", serif':'system-ui, "PingFang SC", sans-serif';
        translation.classList.toggle('rd-reading-blur',state.mode==='bilingual'&&state.style==='blur');
        if(state.mode==='only'){translation.style.marginTop='0';translation.style.border='0';translation.style.paddingLeft='0';}
        else if(state.style!=='line'){translation.style.border='0';translation.style.paddingLeft='0';}
        if(state.mode==='bilingual'&&state.style==='fade')translation.style.opacity='.55';
        if(state.mode==='bilingual'&&state.style==='color')translation.style.color='var(--rd-brand)';
        if(state.mode==='bilingual'&&state.style==='bg'){translation.style.background='var(--rd-tint)';translation.style.padding='8px 10px';translation.style.borderRadius='5px';}
        if(state.mode==='bilingual'&&state.style==='dashed'){translation.style.textDecoration='underline dashed var(--rd-brand)';translation.style.textUnderlineOffset='5px';}
        if(state.mode==='bilingual'&&state.style==='quote'){translation.style.borderLeft='4px solid var(--rd-brand)';translation.style.padding='6px 10px';translation.style.background='var(--rd-side)';}
        if(state.mode==='bilingual'&&state.style==='border'){translation.style.border='1px solid var(--rd-brand)';translation.style.padding='8px 10px';translation.style.borderRadius='5px';}

        qa('[data-shortcut]').forEach(b=>{b.setAttribute('aria-label',shortcutLabels[b.dataset.shortcut]);if(b!==recording)b.textContent=pretty(state.shortcuts[b.dataset.shortcut]);});
        renderAppearance();
      }
      shell.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
        if(b.dataset.nav){navigate(b.dataset.nav);return;}

        for(const key of ['mode','style','theme','color','readingFont'])if(b.dataset[key])state[key]=b.dataset[key];
        if(b.hasAttribute('data-shortcut')){recording=b;b.textContent='按组合键…';q('[data-shortcut-status]').textContent='按组合键录制；Esc 取消，Delete / Backspace 清空。';}
        if(b.hasAttribute('data-shortcut-reset')){state.shortcuts={page:'Alt+E',mode:'Alt+M',video:'Alt+V'};recording=null;q('[data-shortcut-status]').textContent='已恢复默认快捷键。';}
        if(b.hasAttribute('data-prompt-edit'))q('[data-prompt-editor]').hidden=false;
        if(b.hasAttribute('data-prompt-cancel')||b.hasAttribute('data-prompt-apply'))q('[data-prompt-editor]').hidden=true;
        if(b.hasAttribute('data-css-save'))q('[data-css-result]').textContent='已保存';
        if(b.hasAttribute('data-css-cancel')){q('[data-css-placeholder]').value='';q('[data-css-result]').textContent='';}
        render();
      });
      shell.addEventListener('change',e=>{const el=e.target;for(const [attr,key] of [['data-hover','hover'],['data-bold','bold'],['data-input-translation','inputTranslation']])if(el.hasAttribute(attr))state[key]=el.checked;render();});
      shell.addEventListener('keydown',e=>{if(!recording||e.target!==recording||e.key==='Tab')return;e.preventDefault();if(e.key==='Escape'){recording=null;render();return;}if(['Alt','Control','Shift','Meta'].includes(e.key))return;let combo='';if(!['Delete','Backspace'].includes(e.key)){if(!e.altKey&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey){q('[data-shortcut-status]').textContent='请使用修饰键和一个普通按键。';return;}const key=/^Key[A-Z]$/.test(e.code)?e.code.slice(3):e.key.toUpperCase();combo=[e.ctrlKey?'Control':'',e.altKey?'Alt':'',e.shiftKey?'Shift':'',e.metaKey?'Meta':'',key].filter(Boolean).join('+');if(Object.entries(state.shortcuts).some(([k,v])=>k!==recording.dataset.shortcut&&v===combo)){q('[data-shortcut-status]').textContent='此快捷键已用于其他操作，请录制不同的组合键。';return;}}state.shortcuts[recording.dataset.shortcut]=combo;recording=null;q('[data-shortcut-status]').textContent='快捷键已保存';render();});
      shell.addEventListener('focusout',e=>{if(recording===e.target){recording=null;render();}});
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);
      render();createLocalIcons();
      });
    })();

  </script>
</div>
</body></html>
