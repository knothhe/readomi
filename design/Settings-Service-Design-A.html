// Design-only prototype. No real keys, requests, or persisted settings.
const services={deepseek:{name:'DeepSeek',model:'deepseek-chat',url:'https://api.deepseek.com'},gemini:{name:'Gemini',model:'gemini-3.5-flash-lite',url:'https://generativelanguage.googleapis.com'},anthropic:{name:'Anthropic',model:'claude-haiku-4-5',url:'https://api.anthropic.com'},openai:{name:'OpenAI',model:'gpt-4.1-mini',url:'https://api.openai.com/v1'},compatible:{name:'本地模型',model:'qwen3:8b',url:'http://localhost:11434/v1'}};
let current='deepseek',selected='deepseek';
const feedback=text=>{const el=document.querySelector('[data-feedback]');if(el)el.textContent=text;};
function loadService(id){selected=id;const item=services[id];const testButton=document.querySelector('.editor-head [data-test]');if(testButton)testButton.setAttribute('aria-label','测试 '+item.name+' 连接');const type=document.getElementById('type');if(!type)return;type.value=id;document.getElementById('name').value=item.name;document.getElementById('url').value=item.url;document.getElementById('model').value=item.model;document.getElementById('key').value='';document.getElementById('key').placeholder='已保存密钥，留空沿用';document.querySelector('[data-no-key]').checked=false;document.getElementById('key').disabled=false;document.querySelectorAll('[data-select]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.select===id)));const name=document.querySelector('[data-editor-name]');if(name)name.textContent=item.name;const editorMark=document.querySelector('[data-editor-mark]');if(editorMark){const row=document.querySelector('[data-select="'+id+'"] .provider');if(row)editorMark.replaceChildren(row.cloneNode(true));}const use=document.querySelector('[data-use]');if(use)use.hidden=id===current;document.querySelector('[data-model-results]').hidden=true;document.getElementById('document').value=JSON.stringify({type:id,name:item.name,model:item.model,apiKey:'YOUR_API_KEY'},null,2);feedback('');}
function useService(id){current=id;document.querySelectorAll('[data-select]').forEach(el=>{el.classList.toggle('current',el.dataset.select===id);el.querySelector('.badge').hidden=el.dataset.select!==id;});document.querySelectorAll('[data-pick]').forEach(el=>{const active=el.dataset.pick===id;el.setAttribute('aria-checked',String(active));el.closest('.service-row').classList.toggle('current',active);el.querySelector('.badge').hidden=!active;});const use=document.querySelector('[data-use]');if(use)use.hidden=selected===current;feedback('设计预览：已切换为 '+services[id].name);}
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;
if(button.dataset.mode){document.querySelectorAll('[data-mode]').forEach(el=>el.setAttribute('aria-selected',String(el===button)));document.getElementById('manual-panel').hidden=button.dataset.mode!=='manual';document.getElementById('agent-panel').hidden=button.dataset.mode!=='agent';document.querySelectorAll('#manual-panel input,#manual-panel select').forEach(el=>el.disabled=button.dataset.mode==='agent');if(button.dataset.mode==='manual')document.getElementById('key').disabled=document.querySelector('[data-no-key]').checked;feedback('');}
if(button.dataset.pick)useService(button.dataset.pick);
if(button.dataset.select)loadService(button.dataset.select);
if(button.hasAttribute('data-use'))useService(selected);
if(button.hasAttribute('data-eye')){const key=document.getElementById('key');key.type=key.type==='password'?'text':'password';button.setAttribute('aria-label',key.type==='password'?'显示 API Key':'隐藏 API Key');}
if(button.hasAttribute('data-fetch')){const results=document.querySelector('[data-model-results]');results.replaceChildren();const id=document.getElementById('type').value;[services[id].model,id==='deepseek'?'deepseek-reasoner':services[id].model+'-preview'].forEach(model=>{const option=document.createElement('button');option.type='button';option.textContent=model;option.addEventListener('click',()=>{document.getElementById('model').value=model;results.hidden=true;feedback('');});results.append(option);});results.hidden=false;feedback('设计预览：示例模型');}
if(button.hasAttribute('data-new')){loadService('openai');document.getElementById('name').value='';document.getElementById('model').value='';document.getElementById('key').placeholder='输入 API Key';const title=document.querySelector('[data-editor-name]');if(title)title.textContent='添加服务';document.querySelector('[data-use]').hidden=true;}
if(button.hasAttribute('data-test'))feedback('设计预览：连接成功');
if(button.hasAttribute('data-copy'))navigator.clipboard.writeText('请帮我配置 Readomi 翻译服务。验证服务地址、模型和 API Key 后，返回含 type、name、baseURL、apiKey 和 model 的配置 JSON。无鉴权服务设置 noApiKey: true。').then(()=>feedback('已复制说明')).catch(()=>feedback('无法复制，请重试'));
});
document.addEventListener('change',event=>{if(event.target.matches('[data-no-key]'))document.getElementById('key').disabled=event.target.checked;if(event.target.id==='type'){const item=services[event.target.value];document.getElementById('name').value=item.name;document.getElementById('url').value=item.url;document.getElementById('model').value=item.model;document.getElementById('key').value='';document.getElementById('key').placeholder='输入 API Key';document.querySelector('[data-model-results]').hidden=true;feedback('');}});
document.querySelector('form')?.addEventListener('submit',event=>{event.preventDefault();if(!document.getElementById('agent-panel').hidden){try{const value=JSON.parse(document.getElementById('document').value);if(!value.type||!value.model)throw new Error();}catch{feedback('请输入包含服务类型和模型的有效配置');return;}}feedback('设计预览：测试通过，已保存');});
document.addEventListener('click',event=>{document.querySelectorAll('.menu[open]').forEach(menu=>{if(!menu.contains(event.target))menu.open=false;});});
const service=new URLSearchParams(location.search).get('service');if(service&&services[service])loadService(service);
const pageTitle=document.querySelector('[data-page-title]');if(pageTitle&&service){pageTitle.textContent=service==='openai'?'添加服务':'修改 '+services[service].name;if(service==='openai'){document.getElementById('name').value='';document.getElementById('model').value='';document.getElementById('key').placeholder='输入 API Key';}}
if(document.getElementById('agent-panel')&&!document.getElementById('agent-panel').hidden)document.querySelectorAll('#manual-panel input,#manual-panel select').forEach(el=>el.disabled=true);

</script></body></html>
