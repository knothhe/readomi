<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Readomi · 服务拖动排序设计</title><style>

abel[for="keyboard"]{background:#f4e6de;color:#b6533e}#keyboard:focus-visible~header label[for="keyboard"]{outline:2px solid #b6533e;outline-offset:2px}#mobile:checked~.views .mobile{display:block}#mobile:checked~header label[for="mobile"]{background:#f4e6de;color:#b6533e}#mobile:focus-visible~header label[for="mobile"]{outline:2px solid #b6533e;outline-offset:2px}
