<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>翻译服务 · 两版设计对比</title><style>*{box-sizing:border-box}body{margin:0;background:#eeeae3;color:#302e2b;font:13px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{padding:28px 32px 24px;display:flex;justify-content:space-between;gap:20px;align-items:center;border-bottom:1px solid #dcd5ca}h1{font-size:23px;font-weight:600;letter-spacing:-.6px;margin:0 0 4px}p{color:#827b72;margin:0;font-size:12px}.controls{display:flex;gap:4px;background:#e1dbd1;border-radius:7px;padding:3px}button,a{font:inherit;color:inherit;text-decoration:none}button{border:0;border-radius:5px;background:none;padding:7px 12px;cursor:pointer;white-space:nowrap}button[aria-pressed=true]{background:#fffefa;color:#b6533e;box-shadow:0 1px 4px #302e2b12}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;padding:25px 32px}article{min-width:0}.caption{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.caption h2{font-size:14px;font-weight:550;margin:0}.caption h2 b{display:inline-flex;align-items:center;justify-content:center;background:#b6533e;color:#fffaf7;width:24px;height:24px;font-size:12px;border-radius:6px;margin-right:9px}.caption a{font-size:11px;color:#827b72}.caption a:hover{color:#b6533e}.viewport{overflow:hidden;background:#faf8f4;border:1px solid #dcd5ca;border-radius:9px;box-shadow:0 6px 25px #302e2b06;height:570px;position:relative}iframe{border:0;width:1280px;height:1100px;transform-origin:0 0;display:block}.description{margin-top:14px;font-size:12px;line-height:1.8;max-width:570px}.foot{margin:6px 32px 24px;color:#827b72;font-size:11px}button:focus-visible,a:focus-visible{outline:2px solid #b6533e;outline-offset:3px}@media(max-width:950px){header{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.viewport{height:540px}.description{margin-bottom:10px}}@media(max-width:600px){header{padding:22px 18px}.grid{padding:20px 18px}.viewport{height:360px}.foot{margin:0 18px 24px}.caption h2{font-size:13px}.controls{flex-wrap:wrap}button{padding:6px 10px}}</style></head><body><header><div><h1>翻译服务 · 两版设计</h1><p>加入图标，精简文案，移除“更多参数”。</p></div><div class="controls" role="group" aria-label="查看状态"><button type="button" aria-pressed="true" data-view="edit">手动配置</button><button type="button" aria-pressed="false" data-view="list">服务管理</button><button type="button" aria-pressed="false" data-view="agent">agent 配置</button></div></header><div class="grid"><article><div class="caption"><h2><b>A</b>轻量列表 · 独立编辑</h2><a href="Settings-Service-Design-A-Edit.html" data-open="a" target="_blank">单独查看 ↗</a></div><div class="viewport"><iframe title="方案 A" src="Settings-Service-Design-A-Edit.html" id="a"></iframe></div><p class="description">沿用一行服务列表，点击铅笔进入聚焦的编辑页。字段直接展开，以图标替代操作说明，页面更安静。</p></article><article><div class="caption"><h2><b>B</b>服务分栏 · 同页编辑</h2><a href="Settings-Service-Design-B.html" data-open="b" target="_blank">单独查看 ↗</a></div><div class="viewport"><iframe title="方案 B" src="Settings-Service-Design-B.html" id="b"></iframe></div><p class="description">左侧选择服务，右侧直接编辑。当前服务保持标记，切换使用单独操作，方便对照多个配置。</p></article></div><p class="foot">两版均保留服务类型、名称、API 地址、API Key 与模型；获取模型、显示密钥使用图标按钮。交互为本地设计预览。</p><script>const views={edit:['Settings-Service-Design-A-Edit.html','Settings-Service-Design-B.html'],list:['Settings-Service-Design-A.html','Settings-Service-Design-B.html'],agent:['Settings-Service-Design-A-Agent.html','Settings-Service-Design-B-Agent.html']};function resize(){document.querySelectorAll('.viewport').forEach(box=>{const frame=box.querySelector('iframe');frame.style.transform='scale('+box.clientWidth/1280+')';});}new ResizeObserver(resize).observe(document.body);resize();document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-view]').forEach(el=>el.setAttribute('aria-pressed',String(el===button)));const files=views[button.dataset.view];['a','b'].forEach((id,i)=>{document.getElementById(id).src=files[i];document.querySelector('[data-open='+id+']').href=files[i];});}));</script></body></html>
