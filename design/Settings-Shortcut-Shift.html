f.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 7 9-4 9 4v10l-9 4-9-4ZM3 7l9 4 9-4M12 11v10"/></svg><span>备份与同步</span></a></nav></aside><main><h2>快捷键</h2><div class="card"><label class="keyrow">翻译此页 / 显示原文<input value="⌥ E" readonly></label><label class="keyrow">切换双语 / 仅译文<input placeholder="点击录制" readonly></label><label class="keyrow">切换视频字幕<input placeholder="点击录制" readonly></label></div><p class="caption">点击录制组合键；按 Delete 或 Backspace 清空。视频字幕快捷键与弹窗、播放器开关同步，只影响当前页面。</p><div class="card"><label class="keyrow">悬停翻译触发方式<select><option>Option / Alt</option><option>Control</option><option selected>Shift</option><option>反引号 (`)</option><option>鼠标左键长按</option></select></label></div><p class="caption">鼠标停在段落上，点按触发键并松开即可翻译；按住 500 毫秒也会自动翻译，同一次按键只触发一次。鼠标左键需要长按 500 毫秒。再次触发恢复原文；输入框中不触发，组合键或拖动鼠标会取消触发。</p></main></div></html>

<script>(()=>{const p=new URLSearchParams(location.search),root=document.documentElement;
const mode=p.get('theme')||(document.title.includes('深色')||document.title.includes('暗色')?'dark':'light');
const palettes={terra:['#b6533e','#e9ab91'],plum:['#79546d','#c7a5be'],amber:['#946214','#e2bd78'],teal:['#246f73','#8ac1c3']};
const chosen=p.get('color')||'#b6533e',palette=Object.entries(palettes).find(([k,v])=>k===chosen||v.includes(chosen))||['terra',palettes.terra];
const dark=mode==='dark'||mode==='system'&&matchMedia('(prefers-color-scheme: dark)').matches;
root.dataset.previewMode=dark?'dark':'light';root.style.colorScheme=dark?'dark':'light';
const vars=dark?{bg:'#191715',panel:'#262320',surface:'#262320',ink:'#eae3dc',muted:'#afa69b',line:'#443d35'}:{bg:'#faf8f4',panel:'#fffefa',surface:'#fffefa',ink:'#302e2b',muted:'#827b72',line:'#e6e0d6'};
vars.brand=palette[1][dark?1:0];vars.accent=vars.brand;vars.paper=vars.panel;vars.tint='color-mix(in srgb,'+vars.brand+' 13%,'+vars.bg+')';
Object.entries(vars).forEach(([k,v])=>root.style.setProperty('--'+k,v));
const logo=document.querySelector('.brand img');if(logo)logo.src='assets/icon-'+palette[0]+'.svg';
document.querySelectorAll('a[href]').forEach(a=>{if(!/Settings-|Reading-Refinement-(Cache|Languages)/.test(a.getAttribute('href')))return;const u=new URL(a.href);for(const [k,v] of Object.entries({theme:mode,color:palette[1][0]}))u.searchParams.set(k,v);a.href=u.href;});
})();
</script>
