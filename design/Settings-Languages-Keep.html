<!doctype html>
<html lang="zh-CN" style="color-scheme:light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>翻译语言 · Readomi</title>
<style>
:root{--bg:#faf8f4;--surface:#fffefa;--side:#f3f0e9;--ink:#302e2b;--muted:#77716a;--line:#e7e2d9;--brand:#b6533e;--tint:#f4e6de;--success:#4b7560}
html.dark{--bg:#242321;--surface:#2c2a27;--side:#201f1d;--ink:#eeeae4;--muted:#b1aaa1;--line:#433e38;--brand:#e49a83;--tint:#40302a;--success:#9ab6a1}
*{box-sizing:border-box}html,body{margin:0;min-width:0;min-height:900px;background:var(--bg)}body{color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}button,input{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--brand);outline-offset:3px}h1,h2,h3,p{margin:0}svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}[hidden]{display:none!important}
.shell{display:grid;grid-template-columns:172px minmax(0,1fr);min-height:900px;border:1px solid var(--line);border-radius:14px;overflow:clip}.sidebar{display:flex;flex-direction:column;padding:28px 14px 20px;background:var(--side);border-right:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;padding:0 10px 28px;font:23px Georgia,serif;letter-spacing:-.7px}.brand img{width:29px;height:29px}.nav{display:grid;gap:4px}.nav button{display:flex;align-items:center;gap:10px;padding:11px 12px;border:0;border-radius:7px;background:transparent;text-align:left;color:var(--muted);font-size:13px;white-space:nowrap}.nav button[aria-current=page]{background:var(--tint);color:var(--brand);font-weight:600}.nav svg{width:16px;height:16px}.version{margin-top:auto;padding:28px 12px 0;color:var(--muted);font-size:11px}.main{padding:40px 34px 30px;min-width:0}.content{max-width:760px;margin:auto}.heading{margin-bottom:30px}h1{font-size:25px;line-height:1.3;font-weight:600;letter-spacing:-.6px}.heading p{margin-top:10px;color:var(--muted);font-size:13px;line-height:1.7}.section-label{font-size:12px;font-weight:500;color:var(--muted);margin-bottom:10px}.group{background:transparent;border:0;border-radius:0}.rule{position:relative;padding:18px 0;border-bottom:1px solid var(--line)}.rule:nth-child(2){border-bottom:0}.rule-top{display:flex;align-items:center;justify-content:space-between;gap:20px}.rule h2{font-size:13px;font-weight:500}.help{font-size:12px;line-height:1.65;color:var(--muted);margin-top:7px}.extra{display:block;margin-top:2px}.picker{position:relative;flex-shrink:0}.select{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:158px;padding:8px 11px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:12px;text-align:left}.select svg{width:14px;height:14px;color:var(--muted)}.select[aria-expanded=true]{border-color:var(--brand);box-shadow:0 0 0 2px var(--tint)}.auto{display:flex;gap:9px;align-items:flex-start;padding:11px 0 0}.auto>svg{width:16px;height:16px;color:var(--muted);margin-top:2px;flex-shrink:0}.auto h2{font-size:12px;font-weight:400;color:var(--muted)}.auto p{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.65}.scope{display:flex;gap:0;margin-top:3px;color:var(--muted)}.scope span{font-size:11px}.scope span+span::before{content:" · ";white-space:pre}.foot{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px;margin-top:27px}.foot svg{width:13px;height:13px;color:var(--success)}
.menu{position:absolute;top:calc(100% + 7px);right:0;width:244px;padding:7px;background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 32px #302e2b1a;z-index:5}.search{display:flex;gap:7px;align-items:center;padding:8px 9px;margin-bottom:6px;border:1px solid var(--line);border-radius:5px;background:var(--bg)}.search svg{width:14px;height:14px;color:var(--muted);flex-shrink:0}.search input{width:100%;border:0;outline:0;background:transparent;font-size:12px}.search input::placeholder{color:var(--muted)}.option{display:flex;width:100%;gap:9px;align-items:center;text-align:left;background:transparent;border:0;border-radius:5px;padding:9px 9px;font-size:12px}.option:hover{background:var(--side)}.option[aria-selected=true]{background:var(--tint);color:var(--brand)}.option .check{margin-left:auto;width:14px;height:14px;color:var(--brand)}.option .badge{font-size:10px;padding:1px 5px;background:var(--side);color:var(--muted);border-radius:3px;margin-left:auto}.option[aria-selected=true] .badge{background:var(--surface);margin-left:0}.menu-divider{height:1px;background:var(--line);margin:6px 3px}.option-list{max-height:294px;overflow:auto}.empty{padding:18px;text-align:center;color:var(--muted);font-size:12px}.same-help{color:var(--brand)}
@media(max-width:600px){html,body{min-height:900px}.shell{grid-template-columns:1fr;min-height:900px;border-radius:0;border:0;overflow:visible}.sidebar{padding:14px 18px 0;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:0 0 13px;font-size:22px;gap:8px}.brand img{width:25px;height:25px}.nav{display:flex;flex-wrap:wrap;gap:2px;padding-bottom:10px}.nav button{font-size:12px;padding:8px}.nav svg{display:none}.version{display:none}.main{padding:26px 20px 24px}.heading{margin-bottom:22px}h1{font-size:23px}.heading p{font-size:12px;line-height:1.7;margin-top:8px}.section-label{font-size:11px;margin-bottom:8px}.rule{padding:16px 0}.rule-top{gap:10px}.select{min-width:142px;padding:7px 10px}.help{margin-top:8px;font-size:11px;line-height:1.7}.auto{padding:10px 0 0;gap:8px}.auto p{font-size:11px}.scope{margin-top:3px}.scope span{font-size:10px}.foot{display:none}.menu{width:240px;right:0}.extra{margin-top:3px}}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="service" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="6" rx="2"/><rect x="4" y="14" width="16" height="6" rx="2"/><path d="M7 7h.01M7 17h.01M12 7h5M12 17h5"/></symbol><symbol id="language" viewBox="0 0 24 24"><path d="M3 5h12M9 3v2M5 5c0 6 4 9 8 11M13 5c0 6-4 9-8 11m9 5 4-11 4 11m-7-3h6"/></symbol><symbol id="reading" viewBox="0 0 24 24"><path d="M12 5v15M12 5C9 3 5 3 3 4v14c3-1 6-1 9 2 3-3 6-3 9-2V4c-2-1-6-1-9 1"/></symbol><symbol id="video" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3Z"/></symbol><symbol id="quality" viewBox="0 0 24 24"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"/></symbol><symbol id="shortcut" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="3"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h.01M10 14h8"/></symbol><symbol id="appearance" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v16M12 4a8 8 0 0 1 0 16Z"/></symbol><symbol id="backup" viewBox="0 0 24 24"><path d="m3 7 9-4 9 4v10l-9 4-9-4ZM3 7l9 4 9-4M12 11v10M7.5 5l9 4"/></symbol><symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol><symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol><symbol id="chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol><symbol id="search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol><symbol id="sparkle" viewBox="0 0 24 24"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"/></symbol></defs></svg>
<div class="shell"><aside class="sidebar"><div class="brand"><img src="assets/icon-terra.svg" alt="">Readomi</div><nav class="nav" aria-label="设置导航"><button type="button" onclick="location.href='Settings-Multi-Service.html'"><svg><use href="#service"/></svg>翻译服务</button><button aria-current="page" type="button" onclick="location.href='Settings-Languages.html'"><svg><use href="#language"/></svg>翻译语言</button><button type="button" onclick="location.href='Settings-Light-Reading.html'"><svg><use href="#reading"/></svg>网页阅读</button><button type="button" onclick="location.href='Settings-Light-Video.html'"><svg><use href="#video"/></svg>视频字幕</button><button type="button" onclick="location.href='Settings-Refresh-Quality.html'"><svg><use href="#quality"/></svg>译文质量</button><button type="button" onclick="location.href='Settings-Light-Shortcut.html'"><svg><use href="#shortcut"/></svg>快捷键</button><button type="button" onclick="location.href='Settings-Refresh-Appearance.html'"><svg><use href="#appearance"/></svg>外观</button><button type="button" onclick="location.href='Settings-Light-Backup.html'"><svg><use href="#backup"/></svg>备份</button></nav><p class="version">Readomi · 设置</p></aside>
<main class="main"><div class="content"><header class="heading"><h1>翻译语言</h1><p>按原文语言，选择适合你的翻译方向。</p></header><p class="section-label">翻译规则</p><section class="group" aria-label="翻译规则"><div class="rule"><div class="rule-top"><h2>主要语言</h2><div class="picker"><button class="select" id="primary" aria-label="主要语言" aria-describedby="primary-help" aria-haspopup="listbox" aria-expanded="false"><span>简体中文</span><svg><use href="#chevron"/></svg></button><div class="menu" id="primary-menu" hidden></div></div></div><p class="help" id="primary-help">原文为其他语言时，译成「简体中文」。</p></div><div class="rule"><div class="rule-top"><h2>第二语言</h2><div class="picker"><button class="select" id="secondary" aria-label="第二语言" aria-describedby="secondary-help" aria-haspopup="listbox" aria-expanded="false"><span>英语</span><svg><use href="#chevron"/></svg></button><div class="menu" id="secondary-menu" hidden></div></div></div><p class="help" id="secondary-help">原文为「简体中文」时，译成「英语」。</p></div><div class="auto"><svg><use href="#sparkle"/></svg><div><h2>自动识别原文语言</h2><p>模型按段落或字幕句段判断原文语言。</p><div class="scope" aria-label="规则适用范围"><span>网页翻译</span><span>悬停翻译</span><span>视频字幕</span></div></div></div></section>
<p class="foot"><svg><use href="#check"/></svg>这组规则适用于所有翻译入口。</p></div></main></div>
<script>
(function(){
  const initial={theme:'light',primary:'zh-CN',secondary:'keep',menu:false};
  if(initial.theme==='dark')document.documentElement.classList.add('dark');
  const languages=[{code:'zh-CN',label:'简体中文',family:'中文'},{code:'zh-TW',label:'繁體中文',family:'中文'},{code:'en',label:'英语',family:'英语'},{code:'ja',label:'日语',family:'日语'},{code:'ko',label:'韩语',family:'韩语'},{code:'fr',label:'法语',family:'法语'},{code:'de',label:'德语',family:'德语'},{code:'es',label:'西班牙语',family:'西班牙语'}];
  let primary=initial.primary,secondary=initial.secondary;
  const get=code=>languages.find(item=>item.code===code),el=id=>document.getElementById(id),icon=name=>'<svg><use href="#'+name+'"/></svg>';
  function isKeep(){return secondary==='keep'||get(primary).family===get(secondary).family}
  function update(){const p=get(primary),s=secondary==='keep'?null:get(secondary),keep=isKeep();
    el('primary').querySelector('span').textContent=p.label;el('secondary').querySelector('span').textContent=s?s.label:'保持原文';el('primary-help').textContent='原文为其他语言时，译成「'+p.label+'」。';el('secondary-help').classList.toggle('same-help',!!s&&keep);
    el('secondary-help').innerHTML=s&&keep?'主要语言和第二语言相同，该语言的内容将保持原文。<span class="extra">双语对照中只显示原文，不重复展示。</span>':keep?'原文为「'+p.label+'」时，保持原文。<span class="extra">双语对照中只显示原文，不重复展示。</span>':'原文为「'+p.label+'」时，译成「'+s.label+'」。';
  }
  function buildMenu(which,query=''){const box=el(which+'-menu'),current=which==='primary'?primary:secondary,p=get(primary);const choices=(which==='secondary'?[{code:'keep',label:'保持原文',family:''}]:[]).concat(languages);const filtered=choices.filter(item=>item.label.toLowerCase().includes(query.toLowerCase()));let out='<label class="search">'+icon('search')+'<input aria-label="搜索语言" placeholder="搜索语言" value="'+query.replaceAll('&','&amp;').replaceAll('"','&quot;')+'"></label><div class="option-list" role="listbox" aria-label="'+(which==='primary'?'主要语言':'第二语言')+'">';filtered.forEach((item,i)=>{if(item.code==='keep')out+='<button class="option" role="option" aria-selected="'+(item.code===current)+'" data-value="'+item.code+'">'+item.label+(item.code===current?'<svg class="check"><use href="#check"/></svg>':'')+'</button><div class="menu-divider"></div>';else out+='<button class="option" role="option" aria-selected="'+(item.code===current)+'" data-value="'+item.code+'">'+item.label+(which==='secondary'&&item.code===primary?'<span class="badge">主要语言</span>':'')+(item.code===current?'<svg class="check"><use href="#check"/></svg>':'')+'</button>'});out+=filtered.length?'':'<p class="empty">没有找到匹配的语言</p>';box.innerHTML=out+'</div>';box.querySelectorAll('[data-value]').forEach(b=>b.addEventListener('click',()=>{if(which==='primary')primary=b.dataset.value;else secondary=b.dataset.value;closeMenus();update()}));const input=box.querySelector('input');input.addEventListener('input',()=>{const position=input.selectionStart;buildMenu(which,input.value);const fresh=box.querySelector('input');fresh.focus();fresh.setSelectionRange(position,position)});}
  function closeMenus(){['primary','secondary'].forEach(which=>{el(which+'-menu').hidden=true;el(which).setAttribute('aria-expanded','false')})}
  ['primary','secondary'].forEach(which=>{el(which).addEventListener('click',()=>{const open=el(which+'-menu').hidden;closeMenus();if(open){buildMenu(which);el(which+'-menu').hidden=false;el(which).setAttribute('aria-expanded','true')}})});
  document.addEventListener('click',e=>{if(!e.target.closest('.picker'))closeMenus()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenus()});update();if(initial.menu){buildMenu('secondary');el('secondary-menu').hidden=false;el('secondary').setAttribute('aria-expanded','true')}
})();
</script></body></html>
