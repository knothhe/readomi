<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>设置 · 请求参数</title><style>*{box-sizing:border-box}body{margin:0;background:#faf8f5;color:#302b29;font:13px system-ui}.layout{display:flex;gap:40px;width:960px;padding:48px 24px;margin:auto}aside{width:176px;flex-shrink:0}h1{font-size:22px;margin:0 0 32px}nav{display:flex;flex-direction:column;gap:4px}nav a{white-space:normal;padding:10px 12px;border-radius:8px;text-decoration:none;color:#716862}nav .active{background:#f6e8e1;color:#302b29;font-weight:600}main{width:640px}h2{font-size:15px;margin:0 0 12px}.card{background:white;border:1px solid #e8e0db;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px}label{display:block}input,select{width:100%;padding:8px;border:1px solid #d9cdc4;border-radius:8px;font:13px system-ui;background:white}button{font:13px system-ui;padding:7px 12px;border:1px solid #d9cdc4;border-radius:6px;background:white;color:#302b29}.row{display:flex;gap:8px}.row input{flex:1;min-width:0}.primary{background:#b6533e;color:#fff;width:100%}p{margin:0;color:#716862;line-height:1.6;font-size:12px}.error{color:#b42318}@media(max-width:767px){.layout{width:100%;display:block;padding:24px}aside,main{width:100%}nav{flex-direction:row;overflow:auto;margin-bottom:28px}nav a{white-space:nowrap}h1{margin-bottom:16px}}</style><div class="layout"><aside><div style="display:flex;align-items:center;gap:8px;margin-bottom:24px"><img src="assets/icon.svg" width="28" height="28" alt=""><strong style="font-size:18px">Readomi</strong></div><h1>设置</h1><nav><a href="#0" class="active">翻译服务</a><a href="#1" class="">阅读</a><a href="#2" class="">译文质量</a><a href="#3" class="">快捷键</a><a href="#4" class="">局部与视频翻译</a><a href="#appearance">外观</a><a href="#5" class="">配置备份</a></nav></aside><main><h2>翻译服务</h2><div class="card"><div class="row"><button>手动配置</button><button>agent 配置</button></div><label>服务类型<select><option>anthropic</option></select></label><label>名称<input value="anthropic"></label><label>API 地址<input value=""></label><label>API Key<input type="password" value=""></label><p>本地无鉴权服务可填写 local；修改时留空沿用原密钥。</p><div><label for="model">模型</label><div class="row"><input id="model" value="claude-haiku-4-5"><button>获取模型</button></div><p style="margin-top:8px">从当前服务获取模型列表，也可以手动填写模型 ID。</p></div><label>请求格式<select><option>anthropic</option></select></label><div style="display:flex;flex-direction:column;gap:8px"><label for="request-body">请求参数（思考程度等）</label><textarea id="request-body" rows="5" spellcheck="false" placeholder='{ "thinking": { "type": "disabled" } }' style="box-sizing:border-box;width:100%;resize:vertical;padding:10px 12px;border:1px solid #d9cdc4;border-radius:8px;background:white;color:#302b29;font:12px/18px ui-monospace,monospace"></textarea><p style="margin:0;font-size:12px">填写 body 内的 JSON 对象，无需再包一层 body；留空使用服务默认值。参数会合并进每次请求，并覆盖同名字段。</p><p style="margin:0;font-size:12px">思考参数示例（请按模型文档调整）： <code>{ "thinking": { "type": "disabled" } }</code></p></div><button class="primary">测试并保存</button></div></main></div></html>
