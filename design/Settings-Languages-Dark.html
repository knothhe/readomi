<main class="main"><div class="content"><header class="heading"><h1>翻译语言</h1><p>按原文语言，选择适合你的翻译方向。</p></header><p class="section-label">翻译规则</p><section class="group" aria-label="翻译规则"><div class="rule"><div class="rule-top"><h2>主要语言</h2><div class="picker"><button class="select" id="primary" aria-label="主要语言" aria-describedby="primary-help" aria-haspopup="listbox" aria-expanded="false"><span>简体中文</span><svg><use href="#chevron"/></svg></button><div class="menu" id="primary-menu" hidden></div></div></div><p class="help" id="primary-help">原文为其他语言时，译成「简体中文」。</p></div><div class="rule"><div class="rule-top"><h2>第二语言</h2><div class="picker"><button class="select" id="secondary" aria-label="第二语言" aria-describedby="secondary-help" aria-haspopup="listbox" aria-expanded="false"><span>英语</span><svg><use href="#chevron"/></svg></button><div class="menu" id="secondary-menu" hidden></div></div></div><p class="help" id="secondary-help">原文为「简体中文」时，译成「英语」。</p></div><div class="auto"><svg><use href="#sparkle"/></svg><div><h2>自动识别原文语言</h2><p>模型按段落或字幕句段判断原文语言。</p><div class="scope" aria-label="规则适用范围"><span>网页翻译</span><span>悬停翻译</span><span>输入框翻译</span><span>视频字幕</span></div></div></div></section>

<script>
(function(){
  const initial={theme:'dark',primary:'zh-CN',secondary:'en',menu:false};
  if(initial.theme==='dark')document.documentElement.classList.add('dark');
  const languages=[{code:'zh-CN',label:'简体中文',family:'中文'},{code:'zh-TW',label:'繁體中文',family:'中文'},{code:'en',label:'英语',family:'英语'},{code:'ja',label:'日语',family:'日语'},{code:'ko',label:'韩语',family:'韩语'},{code:'fr',label:'法语',family:'法语'},{code:'de',label:'德语',family:'德语'},{code:'es',label:'西班牙语',family:'西班牙语'}];
  let primary=initial.primary,secondary=initial.secondary;
  const get=code=>languages.find(item=>item.code===code),el=id=>document.getElementById(id),icon=name=>'<svg><use href="#'+name+'"/></svg>';
  function isKeep(){return secondary==='keep'||get(primary).family===get(secondary).family}
  function update(){const p=get(primary),s=secondary==='keep'?null:get(secondary),keep=isKeep();
    el('primary').querySelector('span').textContent=p.label;el('secondary').querySelector('span').textContent=s?s.label:'保持原文';el('primary-help').textContent='原文为其他语言时，译成「'+p.label+'」。';el('secondary-help').classList.toggle('same-help',!!s&&keep);
    el('secondary-help').innerHTML=s&&keep?'主要语言和第二语言相同，该语言的内容将保持原文。<span class="extra">双语对照中只显示原文，不重复展示。</span>':keep?'原文为「'+p.label+'」时，保持原文。<span class="extra">双语对照中只显示原文，不重复展示。</span>':'原文为「'+p.label+'」时，译成「'+s.label+'」。';
  }
  function buildMenu(which,query=''){const box=el(which+'-menu'),current=which==='primary'?primary:secondary,p=get(primary);const choices=(which==='secondary'?[{code:'keep',label:'保持原文',family:''}]:[]).concat(languages);const filtered=choices.filter(item=>item.label.toLowerCase().includes(query.toLowerCase()));let out='<label class="search">'+icon('search')+'<input aria-label="搜索语言" placeholder="搜索语言" value="'+query.replaceAll('&','&amp;').replaceAll('"','&quot;')+'"></label><div class="option-list" role="listbox" aria-label="'+(which==='primary'?'主要语言':'第二语言')+'">';filtered.forEach((item,i)=>{if(item.code==='keep')out+='<button class="option" role="option" aria-selected="'+(item.code===current)+'" data-value="'+item.code+'">'+item.label+(item.code===current?'<svg class="check"><use href="#check"/></svg>':'')+'</button><div class="menu-divider"></div>';else out+='<button class="option" role="option" aria-selected="'+(item.code===current)+'" data-value="'+item.code+'">'+item.label+(which==='secondary'&&item.code===primary?'<span class="badge">主要语言</span>':'')+(item.code===current?'<svg class="check"><use href="#check"/></svg>':'')+'</button>'});out+=filtered.length?'':'<p class="empty">没有找到匹配的语言</p>';box.innerHTML=out+'</div>';box.querySelectorAll('[data-value]').forEach(b=>b.addEventListener('click',()=>{if(which==='primary')primary=b.dataset.value;else secondary=b.dataset.value;closeMenus();update()}));const input=box.querySelector('input');input.addEventListener('input',()=>{const position=input.selectionStart;buildMenu(which,input.value);const fresh=box.querySelector('input');fresh.focus();fresh.setSelectionRange(position,position)});}
  function closeMenus(){['primary','secondary'].forEach(which=>{el(which+'-menu').hidden=true;el(which).setAttribute('aria-expanded','false')})}
  ['primary','secondary'].forEach(which=>{el(which).addEventListener('click',()=>{const open=el(which+'-menu').hidden;closeMenus();if(open){buildMenu(which);el(which+'-menu').hidden=false;el(which).setAttribute('aria-expanded','true')}})});
  document.addEventListener('click',e=>{if(!e.target.closest('.picker'))closeMenus()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenus()});update();if(initial.menu){buildMenu('secondary');el('secondary-menu').hidden=false;el('secondary').setAttribute('aria-expanded','true')}
})();
</script><script>document.querySelectorAll('.design-navigation').forEach(nav=>{const sidebar=nav.closest('aside');if(!sidebar)return;sidebar.classList.add('design-sidebar');sidebar.parentElement.classList.add('design-settings-layout');});</script><script>(()=>{const p=new URLSearchParams(location.search),root=document.documentElement;
const material=p.get('material')||document.body.dataset.material||'classic',mode=p.get('theme')||(document.title.includes('深色')||document.title.includes('暗色')?'dark':'light');
const palettes={terra:['#b6533e','#e9ab91'],plum:['#79546d','#c7a5be'],amber:['#946214','#e2bd78'],teal:['#246f73','#8ac1c3']};
const chosen=p.get('color')||'#b6533e',palette=Object.entries(palettes).find(([k,v])=>k===chosen||v.includes(chosen))||['terra',palettes.terra];
const dark=mode==='dark'||mode==='system'&&matchMedia('(prefers-color-scheme: dark)').matches;
root.dataset.material=material;root.dataset.previewMode=dark?'dark':'light';root.style.colorScheme=dark?'dark':'light';
const vars=dark?{bg:'#191715',panel:'#262320',surface:'#262320',ink:'#eae3dc',muted:'#afa69b',line:'#443d35'}:{bg:'#faf8f4',panel:'#fffefa',surface:'#fffefa',ink:'#302e2b',muted:'#827b72',line:'#e6e0d6'};
vars.brand=palette[1][dark?1:0];vars.accent=vars.brand;vars.paper=vars.panel;vars.tint='color-mix(in srgb,'+vars.brand+' 13%,'+vars.bg+')';
