<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>X · 广告层显示，入口保留在底部播放栏</title>
  <style>
    :root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#faf8f5;color:#302b29;font:13px -apple-system,BlinkMacSystemFont,'PingFang SC',system-ui}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #e8b29b;outline-offset:3px}main{padding:36px 40px;width:720px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h1{font-size:15px;font-weight:550;margin:0}header p{margin:0;color:#776d64;font-size:11px}.video{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:linear-gradient(140deg,#24343d,#55505c)}.scene{position:absolute;inset:0;background:radial-gradient(ellipse at 20% 140%,#4d6156 0 38%,transparent 39%),radial-gradient(ellipse at 120% 140%,#667460 0 43%,transparent 44%)}.ad-copy{position:absolute;top:108px;left:50%;transform:translateX(-50%);width:310px;text-align:center;font-size:24px;font-weight:700;color:#fff;text-shadow:0 2px 4px #0005}.ad-copy strong{display:block;margin-top:9px;padding:5px 12px;border-radius:30px;background:#d31312;font-size:26px}.ad-top{position:absolute;top:20px;left:20px;right:20px;display:flex;align-items:center;justify-content:space-between;gap:12px;color:#fff}.ad-link{display:flex;align-items:center;gap:7px;border:0;border-radius:24px;padding:7px 14px;background:#111b;color:#fff;white-space:nowrap;font-size:16px;font-weight:600}.ad-brand{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:white;color:#c22;font-size:6px;font-weight:700}.ad-menu{display:grid;place-items:center;flex-shrink:0;width:34px;height:28px;border:0;border-radius:5px;background:#111a;color:white;font-size:20px;line-height:1}.ad-footer{position:absolute;bottom:69px;left:16px;right:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;color:#fff}.ad-status{display:flex;align-items:center;gap:9px;background:#111b;border-radius:5px;padding:5px 9px;font-size:13px;font-weight:600}.ad-status span+span{border-left:1px solid #fff7;padding-left:9px}.skip{border:0;border-radius:24px;background:#172311dc;color:white;padding:8px 17px;font-size:14px;font-weight:600}.player-controls{position:absolute;bottom:0;left:0;width:100%;height:59px;color:white;background:linear-gradient(transparent,#000b);padding:17px 16px 8px;font:14px system-ui;display:flex;align-items:center;gap:16px}.progress{position:absolute;top:0;left:12px;right:12px;height:3px;background:#fff5}.progress:before{content:'';display:block;width:38%;height:3px;background:#f7f7f7}.time{font-size:11px;white-space:nowrap}.native-right{display:flex;align-items:center;gap:8px;margin-left:auto}.native-actions{display:block;width:18px;flex-shrink:0;text-align:right;white-space:nowrap}.readomi-tools{display:flex;align-items:center;color:white;flex-shrink:0}.details-trigger{display:grid;place-items:center;flex-shrink:0;color:white}.logo{display:block}.video-toggle{display:grid;place-items:center}.scope{margin:12px 0 0;font-size:11px;color:#776d64}

/* Current player tools: two independent actions in one quiet native-toolbar item. */
.readomi-tools{--tool-height:30px;--action-width:32px;--logo-size:19px;--track-width:26px;--track-height:14px;--thumb-size:10px;display:flex;align-items:center;gap:0;min-width:0;min-height:0;height:var(--tool-height);padding:0;border:0;border-radius:4px;background:#ffffff08;box-shadow:none;overflow:hidden}
.x-toolbar .readomi-tools{--tool-height:28px;--action-width:30px;--logo-size:18px;--track-width:24px;--track-height:13px;--thumb-size:9px}
.narrow .readomi-tools,.x-toolbar-mobile .readomi-tools{--tool-height:26px;--action-width:28px;--logo-size:18px;--track-width:23px;--track-height:13px;--thumb-size:9px}
.readomi-tools .details-trigger,.readomi-tools .video-toggle{display:grid;place-items:center;flex:0 0 var(--action-width);width:var(--action-width);height:100%;min-height:0;padding:0;border:0;border-radius:4px;background:transparent;color:white}
.readomi-tools .video-toggle{position:relative}
.readomi-tools .video-toggle::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:1px;height:12px;background:#ffffff18;pointer-events:none}
.readomi-tools:hover,.readomi-tools .details-trigger:hover,.readomi-tools .details-trigger[aria-expanded=true],.readomi-tools .video-toggle:hover{background:#ffffff12}
.readomi-tools button:focus-visible{outline:2px solid #e8b29b;outline-offset:-2px}
.readomi-tools .details-trigger .logo{display:block;width:var(--logo-size);height:var(--logo-size)}
.readomi-tools .video-toggle .toggle-track{display:block;position:relative;width:var(--track-width);height:var(--track-height);padding:0;border:0;border-radius:999px;background:#ffffff1c;box-shadow:inset 0 0 0 1px #ffffff28}
.readomi-tools .video-toggle .toggle-thumb{display:block;position:absolute;left:2px;top:2px;width:var(--thumb-size);height:var(--thumb-size);border-radius:50%;background:#ffffffb3;box-shadow:none}
.readomi-tools .video-toggle[aria-pressed=true] .toggle-track{background:#b6533e;box-shadow:none}
.readomi-tools .video-toggle[aria-pressed=true] .toggle-thumb{background:#fff8ec;transform:translateX(calc(var(--track-width) - var(--thumb-size) - 4px))}
</style>
</head>
<body class="x-toolbar">
  <main>
    <header><h1>X · 广告层显示，入口保留在底部播放栏</h1><p>Readomi</p></header>
    <div class="video">
      <div class="scene"></div>
      <div class="ad-copy">未来マーケティング企業<strong>キヤノン</strong></div>
      <div class="ad-top">
        <button class="ad-link"><span class="ad-brand" aria-hidden="true">Canon</span>访问 キヤノンマーケティングジャパン</button>
        <button class="ad-menu" aria-label="广告选项">⋯</button>
      </div>
      <div class="ad-footer"><div class="ad-status"><span>0:02</span><span>视频将在广告后播放</span></div><button class="skip">跳过 <span aria-hidden="true">⏭</span></button></div>
      <div class="player-controls">
        <div class="progress"></div><span aria-hidden="true">Ⅱ</span><span class="time">0:13 / 0:15</span>
        <div class="native-right">
          <div class="readomi-tools" aria-label="视频翻译">
            <button class="details-trigger" aria-label="调整字幕预设" title="调整字幕预设" aria-expanded="false"><img class="logo" src="assets/icon-terra.svg" alt="Readomi"></button>
            <button class="video-toggle" aria-label="关闭视频翻译" aria-pressed="true" title="关闭视频翻译 · 仅对当前页面生效"><span class="toggle-track" aria-hidden="true"><span class="toggle-thumb"></span></span></button>
          </div>
          <span class="native-actions" aria-label="全屏">⛶</span>
        </div>
      </div>
    </div>
    <p class="scope">仅对当前页面生效</p>
  </main>
</body>
</html>
