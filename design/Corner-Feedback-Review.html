<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Readomi · 右下角提示 · 设计预览</title>
<style>
:root{color-scheme:light;--bg:#f4efe9;--card:#fffdfa;--ink:#302b29;--muted:#776d64;--line:#e2d8cd;--accent:#b6533e;--wash:#f5e7df}.dark{color-scheme:dark;--bg:#211e1c;--card:#2c2723;--ink:#ede4dc;--muted:#b3a699;--line:#473d34;--accent:#db9278;--wash:#493027}*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:var(--bg);color:var(--ink);font:13px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",system-ui,sans-serif}main{max-width:1360px;padding:28px 36px 24px;margin:auto}.eyebrow{color:var(--muted);font-size:11px;letter-spacing:.08em;margin:0 0 6px}h1{font-size:27px;line-height:1.3;letter-spacing:-.6px;font-weight:600;margin:0}.intro{margin:10px 0 20px;color:var(--muted);font-size:12px}.specs{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:13px 0;margin-bottom:18px}.specs strong{font-size:12px;font-weight:500}.specs p{font-size:11px;color:var(--muted);margin:3px 0 0}.toolbar,.preferences{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.toolbar{margin-bottom:10px}.preferences{margin-bottom:14px;gap:18px}.preferences label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px;cursor:pointer}input{accent-color:var(--accent)}button,select{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);height:34px;padding:0 12px;cursor:pointer}select{max-width:250px}button.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}button:hover{filter:brightness(.96)}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.status{margin-left:auto;color:var(--muted);font-size:11px;min-width:90px;text-align:right}.stage{height:720px;overflow:hidden;position:relative;border:1px solid var(--line);border-radius:12px;background:var(--card)}.screen{position:absolute;left:50%;top:50%;width:1280px;height:900px;transform-origin:center}.screen iframe{display:block;border:0;width:100%;height:100%;background:var(--card)}.stage.mobile{background:var(--wash)}.stage.mobile .screen{width:390px;height:844px;box-shadow:0 5px 30px #34201718;border-radius:14px;overflow:hidden}footer{margin-top:12px;display:flex;justify-content:space-between;gap:20px;font-size:11px;color:var(--muted)}footer a{color:var(--accent);text-decoration:none}footer a:hover{text-decoration:underline}@media(max-width:700px){main{padding:20px 16px}.specs{grid-template-columns:1fr;gap:10px}.stage{height:620px}.status{margin-left:0}footer{display:block}}
</style>
</head>
<body><main>
<p class="eyebrow">READOMI / 页面角落提示</p><h1>同一个角落，同一种淡入淡出。</h1>
<p class="intro">通用通知、站点适配面板和规则保存提示统一在右下角。选择场景，查看出现、关闭以及多条提示同时出现的效果。</p>
<div class="specs"><div><strong>固定位置 · 右下角</strong><p>桌面边距 20 px · 窄屏 12 px · 右对齐 · 间距 8 px</p></div><div><strong>统一 Motion · 纯透明度</strong><p>淡入 180 ms · 淡出 160 ms · 固定位置与尺寸</p></div><div><strong>多条提示 · 向上堆叠</strong><p>面板保持底部位置 · 通知在上方 · 悬停与聚焦暂停倒计时</p></div></div>
<div class="toolbar"><select id="scenario" aria-label="预览场景"><option value="error">输入框翻译失败</option><option value="api-key">缺少 API Key</option><option value="replace-failed">无法替换输入</option><option value="success">设置恢复成功</option><option value="prepare">站点适配 · 准备</option><option value="panel">站点适配 · 预览中</option><option value="folded">站点适配 · 收起</option><option value="saved">站点规则已保存</option><option value="undone">已撤销本次修改</option><option value="stack">通知 + 适配面板</option><option value="multiple">多条通知</option></select><button class="primary" id="show">播放淡入</button><button id="exit">播放淡出</button><button id="append">再来一条通知</button><button id="timed">播放自动消失</button><span class="status" role="status">静态预览</span></div>
<div class="preferences"><label><input id="slow" type="checkbox">慢放 ×4</label><label><input id="dark" type="checkbox">深色</label><label><input id="mobile" type="checkbox">窄屏</label><label><input id="reduce" type="checkbox">减少动态效果</label></div>
<div class="stage"><div class="screen"><iframe src="Corner-Feedback-Error.html" title="右下角提示 · 网页中的实际效果"></iframe></div></div>
<footer><span>仅设计预览 · 普通通知 4 秒 / 保存 8 秒 / 撤销 3 秒 · 减少动态效果时即时显示或隐藏</span><a href="index.html">打开完整设计画布 ↗</a></footer>
</main><script>
const frame=document.querySelector('iframe');
const stage=document.querySelector('.stage');
const screen=document.querySelector('.screen');
const scenario=document.querySelector('#scenario');
const status=document.querySelector('.status');
const preferences={slow:false,dark:false,mobile:false,reduce:false};
function send(data){frame.contentWindow.postMessage({type:'readomi-corner-command',...data},'*');}
function resize(){const width=preferences.mobile?390:1280,height=preferences.mobile?844:900;screen.style.transform=`translate(-50%,-50%) scale(${Math.min(1,stage.clientWidth/width,stage.clientHeight/height)})`;}
function update(){stage.classList.toggle('mobile',preferences.mobile);document.documentElement.classList.toggle('dark',preferences.dark);send({action:'preferences',...preferences});resize();}
new ResizeObserver(resize).observe(stage);resize();
frame.addEventListener('load',update);
scenario.addEventListener('change',()=>send({action:'show',state:scenario.value}));
document.querySelector('#show').addEventListener('click',()=>send({action:'show',state:scenario.value}));
document.querySelector('#exit').addEventListener('click',()=>send({action:'exit'}));
document.querySelector('#append').addEventListener('click',()=>send({action:'append'}));
document.querySelector('#timed').addEventListener('click',()=>{send({action:'show',state:scenario.value,live:true});status.textContent='播放自动消失';});
Object.keys(preferences).forEach(key=>document.querySelector('#'+key).addEventListener('change',event=>{preferences[key]=event.target.checked;update();}));
window.addEventListener('message',event=>{if(event.source===frame.contentWindow&&event.data?.type==='readomi-corner-status')status.textContent=event.data.state;});
</script></body></html>
