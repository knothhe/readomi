<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>悬停 · 已聚焦输入框 · 反引号正常输入</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #faf8f5; color: #302b29; font: 15px/1.6 system-ui; }
  .chat { display: grid; grid-template-columns: 200px 1fr; width: 960px; height: 620px; }
  aside { padding: 24px 16px; background: #f2eee9; border-right: 1px solid #e8e0db; }
  aside strong { display: block; margin: 0 12px 32px; font-size: 16px; }
  nav { display: grid; gap: 6px; color: #716862; }
  nav span { padding: 8px 12px; border-radius: 6px; }
  nav .active { background: #e8e0db; color: #302b29; }
  main { display: flex; flex-direction: column; min-width: 0; }
  header { padding: 18px 28px; border-bottom: 1px solid #e8e0db; font-weight: 600; }
  .messages { flex: 1; padding: 32px 28px; }
  article { display: grid; grid-template-columns: 36px 1fr; gap: 12px; margin: 0 0 32px; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: #e8e0db; text-align: center; line-height: 36px; font-size: 13px; }
  .author { margin: 0 0 5px; font-size: 14px; font-weight: 600; }
  time { margin-left: 8px; color: #8b7e75; font-size: 11px; font-weight: 400; }
  p { margin: 0; }
  .translation { margin-top: 10px; color: #b6533e; }
  .message-text { position: relative; }
  .pointer { position: absolute; top: 34px; left: 285px; width: 14px; height: 20px; clip-path: polygon(0 0, 100% 75%, 54% 75%, 72% 100%, 47% 100%, 30% 77%, 0 100%); background: #302b29; filter: drop-shadow(0 0 1px white); }
  .composer { margin: 0 28px 28px; }
  textarea { display: block; resize: none; width: 100%; height: 64px; padding: 18px; border: 1px solid #d9cdc4; border-radius: 8px; background: white; color: #302b29; font: inherit; outline: none; }
  textarea::placeholder { color: #8b7e75; }
  textarea { border-color: #b6533e; box-shadow: 0 0 0 2px #f6e8e1; }
  .caret { position: absolute; width: 1px; height: 20px; background: #302b29; margin: 22px 0 0 28px; }
</style>
<div class="chat">
  <aside><strong>Reading room</strong><nav aria-label="Channels"><span># general</span><span class="active"># reading</span><span># book-club</span></nav></aside>
  <main>
    <header># reading</header>
    <section class="messages" aria-label="Messages">
      <article><div class="avatar">M</div><div><p class="author">Morgan <time>10:32</time></p><div class="message-text"><p lang="en">Reading and experience train your model of the world.</p><span class="pointer" aria-hidden="true"></span></div></div></article>
      <article><div class="avatar">R</div><div><p class="author">Riley <time>10:35</time></p><p lang="en">Even if you forget what you read, the experience remains.</p></div></article>
    </section>
    <div class="composer"><span class="caret" aria-hidden="true"></span><textarea aria-label="Message #reading" autofocus>`</textarea></div>
  </main>
</div>
</html>
