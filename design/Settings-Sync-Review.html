<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>备份与同步 · 设计预览 — Readomi</title><style>*{box-sizing:border-box}body{margin:0;background:#eeeae2;color:#302e2b;font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{padding:20px 28px 16px;border-bottom:1px solid #ddd6cc;background:#fffefa}h1{font-size:17px;margin:0;font-weight:600}p{color:#77716a;font-size:12px;margin:5px 0 14px}nav{display:flex;gap:6px;flex-wrap:wrap}nav a{font-size:11px;text-decoration:none;color:#77716a;border:1px solid #e7e2d9;border-radius:6px;padding:5px 9px}nav a[aria-current]{background:#f4e6de;color:#b6533e;border-color:#e9c8b8}.stage{padding:20px;display:flex;justify-content:center}iframe{width:1280px;max-width:100%;height:960px;border:1px solid #ddd6cc;border-radius:10px;background:#faf8f4;box-shadow:0 6px 30px #302e2b08}.stage.mobile iframe{width:390px;height:1120px}@media(max-width:600px){header{padding:16px}.stage{padding:12px}}a:focus-visible{outline:2px solid #b6533e;outline-offset:3px}</style></head><body><header><h1>备份与同步 · 设计预览</h1><p>上方切换状态和浏览器；非 Chrome 浏览器的同步开关不可用。此预览不会读取或修改真实配置。</p><nav aria-label="设计状态"><a href="Settings-Sync-Off.html" target="preview" data-state="Off" >未开启</a><a href="Settings-Sync-On.html" target="preview" data-state="On" aria-current=true>已开启</a><a href="Settings-Sync-First.html" target="preview" data-state="First" >首次开启 · 已有同步配置</a><a href="Settings-Sync-Pending.html" target="preview" data-state="Pending" >正在保存</a><a href="Settings-Sync-Missing-Key.html" target="preview" data-state="Missing-Key" >新设备 · 待补填密钥</a><a href="Settings-Sync-Failed.html" target="preview" data-state="Failed" >保存失败</a><a href="Settings-Sync-Quota.html" target="preview" data-state="Quota" >容量超限</a><a href="Settings-Sync-Import.html" target="preview" data-state="Import" >导入备份 · 同步已开启</a><a href="Settings-Sync-Import-Saved.html" target="preview" data-state="Import-Saved" >导入完成 · 等待同步</a><a href="Settings-Sync-Mobile.html" target="preview" data-state="Mobile" >窄屏 · 已开启</a><a href="Settings-Sync-Dark.html" target="preview" data-state="Dark" >深色 · 已开启</a><a href="Settings-Sync-Edge.html" target="preview" data-state="Edge">Edge · 不支持</a><a href="Settings-Sync-Firefox.html" target="preview" data-state="Firefox">Firefox · 不支持</a><a href="Settings-Sync-Other.html" target="preview" data-state="Other">其他浏览器 · 不支持</a></nav></header><div class="stage"><iframe name="preview" src="Settings-Sync-On.html" title="备份与同步设置预览"></iframe></div><script>document.querySelectorAll('nav a').forEach(a=>a.addEventListener('click',()=>{document.querySelectorAll('nav a').forEach(b=>b.removeAttribute('aria-current'));a.setAttribute('aria-current','true');document.querySelector('.stage').classList.toggle('mobile',a.dataset.state==='Mobile')}));document.querySelector('iframe').addEventListener('load',function(){const state=this.contentWindow.location.pathname.split('Settings-Sync-')[1]?.split('.html')[0];document.querySelectorAll('nav a').forEach(a=>{a.toggleAttribute('aria-current',a.dataset.state===state)});document.querySelector('.stage').classList.toggle('mobile',state==='Mobile')});</script></body></html>
