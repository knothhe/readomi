<div id="readomi-settings-light">
  <style>
    #readomi-settings-light { --rd-bg: light-dark(#faf8f4,#242321); --rd-panel: light-dark(#fffefa,#2c2a27); --rd-side: light-dark(#f3f0e9,#201f1d); --rd-ink: light-dark(#302e2b,#eeeae4); --rd-muted: light-dark(#77716a,#b1aaa1); --rd-line: light-dark(#e7e2d9,#433e38); --rd-brand: light-dark(#b6533e,#e49a83); --rd-tint: light-dark(#f4e6de,#40302a); --rd-success: light-dark(#4b7560,#9ab6a1); --rd-radius: 10px; --rd-row: 18px; color:var(--rd-ink); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; }

        for(const key of ['mode','style','theme','color','readingFont'])if(b.dataset[key])state[key]=b.dataset[key];
        if(b.hasAttribute('data-shortcut')){recording=b;b.textContent='按组合键…';q('[data-shortcut-status]').textContent='按组合键录制；Esc 取消，Delete / Backspace 清空。';}
        if(b.hasAttribute('data-shortcut-reset')){state.shortcuts={page:'Alt+E',mode:'Alt+M',video:'Alt+V'};recording=null;q('[data-shortcut-status]').textContent='已恢复默认快捷键。';}
        if(b.hasAttribute('data-prompt-edit'))q('[data-prompt-editor]').hidden=false;
        if(b.hasAttribute('data-prompt-cancel')||b.hasAttribute('data-prompt-apply'))q('[data-prompt-editor]').hidden=true;
        if(b.hasAttribute('data-css-save'))q('[data-css-result]').textContent='已保存';
        if(b.hasAttribute('data-css-cancel')){q('[data-css-placeholder]').value='';q('[data-css-result]').textContent='';}
        render();
      });
      shell.addEventListener('change',e=>{const el=e.target;for(const [attr,key] of [['data-hover','hover'],['data-bold','bold'],['data-input-translation','inputTranslation']])if(el.hasAttribute(attr))state[key]=el.checked;render();});
      shell.addEventListener('keydown',e=>{if(!recording||e.target!==recording||e.key==='Tab')return;e.preventDefault();if(e.key==='Escape'){recording=null;render();return;}if(['Alt','Control','Shift','Meta'].includes(e.key))return;let combo='';if(!['Delete','Backspace'].includes(e.key)){if(!e.altKey&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey){q('[data-shortcut-status]').textContent='请使用修饰键和一个普通按键。';return;}const key=/^Key[A-Z]$/.test(e.code)?e.code.slice(3):e.key.toUpperCase();combo=[e.ctrlKey?'Control':'',e.altKey?'Alt':'',e.shiftKey?'Shift':'',e.metaKey?'Meta':'',key].filter(Boolean).join('+');if(Object.entries(state.shortcuts).some(([k,v])=>k!==recording.dataset.shortcut&&v===combo)){q('[data-shortcut-status]').textContent='此快捷键已用于其他操作，请录制不同的组合键。';return;}}state.shortcuts[recording.dataset.shortcut]=combo;recording=null;q('[data-shortcut-status]').textContent='快捷键已保存';render();});
      shell.addEventListener('focusout',e=>{if(recording===e.target){recording=null;render();}});
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);
      render();createLocalIcons();
      });
    })();

  </script>
</div>
