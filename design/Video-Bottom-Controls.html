<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>视频 · 底部字幕</title><style>*{box-sizing:border-box}body{margin:0;background:#faf8f5;color:#302b29;font:13px system-ui}h1{font-size:22px;margin:0 0 8px}h2{font-size:15px;margin:0}p{color:#716862;line-height:1.6;margin:0}.video{position:relative;aspect-ratio:16/9;background:linear-gradient(120deg,#342b38,#252c38);border-radius:12px;overflow:hidden}.subtitles{position:absolute;left:50%;top:98%;transform:translate(-50%,-100%);max-width:80%;width:max-content;text-align:center;white-space:pre-line;line-height:1.4;font-weight:600;color:white;text-shadow:0 2px 4px #000,0 0 2px #000}.original{font-size:1em;margin-bottom:4px}.translated{font-size:1em}.compact{background:rgba(15,20,35,.65);padding:8px 14px;border-radius:8px;font-weight:500}.study{background:rgba(15,20,35,.35);padding:10px 16px;border-radius:8px}.old{background:rgba(15,20,35,.85);padding:10px 16px;border-radius:8px;font:500 18px/1.5 system-ui;text-shadow:none}.old .original{font-size:15px}.old .translated{font-size:18px}button,select,input{font:inherit}button{cursor:pointer;color:inherit}.tools{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;background:#151923;white-space:nowrap;font:12px system-ui;color:white;text-shadow:none}.tools button,.tools select{color:white;background:#ffffff1f;border:0;border-radius:4px;padding:4px 8px}.player-controls{position:absolute;bottom:0;left:0;width:100%;height:59px;color:white;background:linear-gradient(transparent,#0009);padding:12px 16px;font:14px system-ui}.progress{position:absolute;top:-3px;left:12px;right:12px;height:6px;background:#fff5}.progress::before{content:"";display:block;width:38%;height:3px;background:#f03}.time{margin-left:18px;font-size:12px}.right{float:right}main{width:720px;padding:36px 40px}</style><style>.subtitles,.caption{line-height:1.4;text-shadow:0 2px 4px #0008;-webkit-text-stroke:.075em #17201ccc;paint-order:stroke fill}.subtitles .original,.caption .original{font-size:1em;margin-bottom:.22em}.caption .translated,.subtitles .translated{font-size:1em}</style><main><div class="video"><div class="player-controls"><div class="progress"></div>Ⅱ<span class="time">1:32 / 4:10</span><span class="right">⚙　⛶</span></div><div class="subtitles clear" style="font-size:20px;top:calc(98% - 70px)"><div class="original">and the long-awaited folding one.</div><div class="translated">以及期待已久的折叠款。</div></div></div></main><script>(()=>{for(const frame of document.querySelectorAll('.video,.player')){const caption=frame.querySelector('.subtitles,.caption');if(!caption)continue;const update=()=>{const rect=frame.getBoundingClientRect();caption.style.fontSize=Math.min(rect.width,rect.height)*.035*1+'px';};new ResizeObserver(update).observe(frame);update();}})();</script></html>
