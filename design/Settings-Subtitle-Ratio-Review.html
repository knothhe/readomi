</style></head><body><header><h1>视频字幕比例 · 三版设置页面</h1><p>A 版已按选择调整。清透 · 视频短边 5% · 原文与译文默认 1:1。B / C 保留为候选稿；以下为静态设计稿。</p></header><main class="review"><input class="tab-input" type="radio" name="variant" id="a" checked><input class="tab-input" type="radio" name="variant" id="b"><input class="tab-input" type="radio" name="variant" id="c"><div class="tabs"><label for="a">A · 已选方案<small>自定义内，字幕字号下方</small></label><label for="b">B · 字号合并<small>译文字号与原文比例放在一起</small></label><label for="c">C · 预览旁调整<small>先选视觉效果，再精细调节</small></label></div>
<section class="panel" id="panel-a"><p>已选 A 版：比例调节放在「自定义」内、「字幕字号」下方，去掉右上角重复的比例数字。<a href="Settings-Subtitle-Ratio-Option-A.html" target="_blank">单独打开 A 版 ↗</a></p><div class="frame"><iframe src="Settings-Subtitle-Ratio-Option-A.html" title="A 版字幕比例设置"></iframe></div></section>
<section class="panel" id="panel-b"><p>将译文字号与原文相对字号放在同一区块，先确定字幕整体大小，再调整两行关系。<a href="Settings-Subtitle-Ratio-Option-B.html" target="_blank">单独打开 B 版 ↗</a></p><div class="frame"><iframe src="Settings-Subtitle-Ratio-Option-B.html" title="B 版字幕比例设置"></iframe></div></section>
<section class="panel" id="panel-c"><p>比例控件紧挨字幕预览，用“较小 / 一样大 / 较大”描述效果；精细调整仍支持 50%～150%。<a href="Settings-Subtitle-Ratio-Option-C.html" target="_blank">单独打开 C 版 ↗</a></p><div class="frame"><iframe src="Settings-Subtitle-Ratio-Option-C.html" title="C 版字幕比例设置"></iframe></div></section>
