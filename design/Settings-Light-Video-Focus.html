        if(event.key==='Tab'){recording=null;render();return;}event.preventDefault();
        if(event.key==='Escape'){recording=null;q('[data-shortcut-status]').textContent='已取消录制。';render();return;}
        if(['Alt','Control','Shift','Meta'].includes(event.key))return;
        if(['Delete','Backspace'].includes(event.key)&&!event.altKey&&!event.ctrlKey&&!event.metaKey&&!event.shiftKey){state.shortcuts[recording.dataset.shortcut]='';recording=null;render();persist();return;}
        if(!event.altKey&&!event.ctrlKey&&!event.metaKey&&!event.shiftKey){q('[data-shortcut-status]').textContent='请使用修饰键和一个普通按键。';return;}
        const key=(event.altKey||event.key==='Dead')&&/^Key[A-Z]$/.test(event.code)?event.code.slice(3):(event.altKey||event.key==='Dead')&&/^Digit[0-9]$/.test(event.code)?event.code.slice(5):event.key.length===1?event.key.toUpperCase():event.key;const combo=[event.ctrlKey?'Control':'',event.altKey?'Alt':'',event.shiftKey?'Shift':'',event.metaKey?'Meta':'',key].filter(Boolean).join('+');
        if(Object.keys(state.shortcuts).some(k=>k!==recording.dataset.shortcut&&state.shortcuts[k]===combo)){q('[data-shortcut-status]').textContent='此快捷键已用于其他操作，请录制不同的组合键。';return;}
        state.shortcuts[recording.dataset.shortcut]=combo;recording=null;q('[data-shortcut-status]').textContent='快捷键已保存';render();persist();
      });
      shell.addEventListener('focusout',event=>{if(recording===event.target){recording=null;render();}});
      qa('[data-caption]').forEach(caption=>{
      caption.addEventListener('pointerdown',event=>{const stage=caption.closest('[data-video-stage]').getBoundingClientRect(),c=caption.getBoundingClientRect();drag={startX:event.clientX,startY:event.clientY,x:(c.left+c.width/2-stage.left)/stage.width*100,y:(c.bottom-stage.top)/stage.height*100,stage};caption.setPointerCapture(event.pointerId);});

      });

      q('[data-service-document]').value=state.serviceConfigured?JSON.stringify({type:'deepseek',name:'DeepSeek',baseURL:'https://api.deepseek.com/v1',apiKey:'sk-••••••',model:state.servicePending?'deepseek-reasoner':'deepseek-chat',api:'openai-chat',headers:{'X-Readomi':'example'},body:{thinking:{type:'disabled'}},temperature:.2},null,2):'';
      q('[data-service-document]').addEventListener('input',()=>{state.servicePending=!!q('[data-service-document]').value.trim();renderService();});
      models.push({scheme,state,render,shell});
      render();
      createLocalIcons();
      });
    })();
