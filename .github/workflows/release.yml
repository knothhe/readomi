name: Release Extension

# Run `pnpm release patch` to preview, then add `--apply` to update the version,
# check, commit, tag and atomically push main and its matching tag. See RELEASING.md.
# A pushed tag also submits the release to the stores through
# submit.yml when Chrome credentials are configured; rebuilding assets for an
# existing tag does not.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild assets for (e.g., v1.2.0)"
        required: true
        type: string

concurrency: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Release Extension
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      stores-configured: ${{ steps.store-config.outputs.configured }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      HUSKY: 0
    steps:
      - name: Checkout Release Tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Check Tag Matches package.json Version
        run: |
          VERSION=$(jq -r .version package.json)
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          # A job that publishes release assets must not restore a cache.
          package-manager-cache: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm test

      - name: Test Version Management
        run: pnpm test:release

      - name: Build and Zip Extension
        run: pnpm zip:all

      - name: Create GitHub Release
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            node scripts/release-notes.mjs "$GITHUB_REPOSITORY" "$TAG" > "$RUNNER_TEMP/release-notes.md"
            gh release create "$TAG" --verify-tag --notes-file "$RUNNER_TEMP/release-notes.md" --title "$TAG"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload Extension Zips to Release
        run: |
          VERSION=$(jq -r .version package.json)
          gh release upload "$TAG" \
            ".output/readomi-$VERSION-chrome.zip" \
            ".output/readomi-$VERSION-edge.zip" \
            ".output/readomi-$VERSION-firefox.zip" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check Store Credentials
        id: store-config
        run: |
          if [ -n "$CHROME_EXTENSION_ID" ] && [ -n "$CHROME_CLIENT_ID" ] && [ -n "$CHROME_CLIENT_SECRET" ] && [ -n "$CHROME_REFRESH_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Chrome credentials are incomplete; skipping store submission."
          fi
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}

  submit:
    name: Submit to Stores
    needs: release
    if: github.event_name == 'push' && needs.release.outputs.stores-configured == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/submit.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
      CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
      CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
      EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
      EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
      EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
